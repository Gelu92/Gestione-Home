<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Spesa, sezione di Home">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Spesa</title>
<meta name="theme-color" content="#1E6B47">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app a una colonna; header in alto, barra di inserimento fissa sopra le schede in basso */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --sunk:#E4EAE2; --ink:#17221C; --muted:#5D6B63; --line:#D5DDD3;
  --accent:#1E6B47; --accent-ink:#FFFFFF; --accent-soft:#D7ECDF; --tomato:#E4572E; --gold:#E9B44C;
  --ok:#2E7D5B; --warn:#A8690F; --warn-soft:#FBEBCF; --bad:#C2412D; --bad-soft:#F8DDD7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --nav-h:62px; --add-h:118px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --sunk:#121915; --ink:#E5EDE7; --muted:#93A39A; --line:#29342E;
  --accent:#58C48F; --accent-ink:#06241A; --accent-soft:#173A2A; --tomato:#F07A5A; --gold:#E9B44C;
  --ok:#5CC491; --warn:#E9B44C; --warn-soft:#3A2E16; --bad:#F07A63; --bad-soft:#3D1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --sunk:#121915; --ink:#E5EDE7; --muted:#93A39A; --line:#29342E;
  --accent:#58C48F; --accent-ink:#06241A; --accent-soft:#173A2A; --tomato:#F07A5A; --gold:#E9B44C;
  --ok:#5CC491; --warn:#E9B44C; --warn-soft:#3A2E16; --bad:#F07A63; --bad-soft:#3D1F1A; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:30px;height:30px;border-radius:8px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-install{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;flex:none}
.btn-install svg{width:16px;height:16px}
.hdr-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.hdr-btn svg{width:20px;height:20px}
.hdr-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:340px){.brand-mark{display:none}}

main{max-width:640px;margin:0 auto;padding-block:14px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
body.with-add main{padding-bottom:calc(var(--nav-h) + var(--add-h) + 24px + env(safe-area-inset-bottom,0px))}

.sample-note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.sample-note button{border:0;background:transparent;color:var(--warn);font-weight:600;padding:4px 0;text-decoration:underline}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.note button{border:0;background:none;color:var(--accent);font-weight:600;text-decoration:underline;padding:4px 0}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--accent);font-weight:600}
.chip .c{font-size:12px;opacity:.7}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.summary .big{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1}
.summary .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.summary .right{text-align:right}
.summary .right b{font-size:18px}
.bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.tbtn svg{width:16px;height:16px}
.tbtn.wa{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600;text-decoration:none}
.tbtn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

section.block{display:flex;flex-direction:column;gap:8px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block-head h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;border:0;background:none;padding:0}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none;min-height:56px}
.it:first-child{border-top:0}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:var(--accent-ink);transition:background .15s}
.ck svg{width:14px;height:14px}
.it.ok .ck{background:var(--accent);border-color:var(--accent)}
.it .main{flex:1;min-width:0}
.it .t{font-weight:500;overflow-wrap:anywhere}
.it .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.it.ok .t{text-decoration:line-through;color:var(--muted)}
.it .pr{font-size:13px;color:var(--muted);white-space:nowrap}
.ed{width:38px;height:38px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.ed svg{width:17px;height:17px}
.qta{font-family:var(--f-num);font-weight:600;color:var(--accent);font-size:.92em}
body.shop .it{min-height:68px;padding-block:16px}
body.shop .it .t{font-size:18px}
body.shop .ck{width:30px;height:30px}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;white-space:nowrap}
.star{width:36px;height:36px;border:0;background:none;display:grid;place-items:center;color:var(--line);flex:none;border-radius:50%}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{color:var(--gold)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:18px} .stat small{color:var(--muted);font-size:12px}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:170px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.col .v{font-size:11px;color:var(--muted);white-space:nowrap}
.col .b{width:70%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--line);min-height:2px}
.col.cur .b{background:var(--accent)} .col.cur .v{color:var(--ink);font-weight:600}
.col .m{font-size:12px;color:var(--muted);text-transform:capitalize}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.btn.tomato{background:var(--tomato);color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:14px}
.settings{display:flex;flex-direction:column;gap:12px}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.reprow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line)}
.reprow:first-child{border-top:0}
.reprow span{flex:1}
.mv{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.mv svg{width:16px;height:16px}
.mv:disabled{opacity:.3}

/* barra di inserimento */
.addbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:19;background:var(--bg);border-top:1px solid var(--line);
  padding-block:8px 10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.addbar .inner{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.addrow button{width:50px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.addrow button svg{width:24px;height:24px}
.sugg{min-height:36px}
.addrow .mic{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.addrow .mic.on{background:var(--tomato);color:#fff;border-color:var(--tomato);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.addrow .mic.on{animation:none}}
.fin .row{padding-block:10px}
.fin .row .s{white-space:normal}
.forgot{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.forgot h3{margin:0;font-size:15px}
.forgot .fr{display:flex;align-items:center;gap:10px;font-size:14px}
.forgot .fr span{flex:1;min-width:0;overflow-wrap:anywhere}
.forgot .fr small{color:var(--warn);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.preset{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.preset:first-child{border-top:0}
.preset .main{flex:1;min-width:0}
.preset .t{font-weight:600}
.preset .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snz{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px 6px;flex:none}
.sugg .chip{padding:6px 11px;font-size:13px}
.sugg .lbl{font-size:12px;color:var(--muted);align-self:center;flex:none}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,15,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
.sheet p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.field textarea{min-height:140px;font-size:14px}
.field textarea.mono{font-family:var(--f-num);font-size:12px}
.amount-in{font-family:var(--f-num);font-size:26px !important;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.grid3{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.grid3>*{min-width:0}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

body.with-add .toast{bottom:calc(var(--nav-h) + var(--add-h) + 14px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--gold);font-weight:700;padding:4px 2px;flex:none}

/* dentro Home: l'intestazione la fa Home */
html.in-home header.top{display:none!important}
html.in-home body::before{display:none}
/* modalità computer */
html.desk main{max-width:1040px;padding-top:78px!important;padding-bottom:110px!important}
html.desk nav.tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding-left:16px;padding-right:16px}
html.desk .tab{flex-direction:row;height:56px;padding:0 18px;font-size:14px;gap:8px;flex:0 0 auto}
html.desk .tab .badge{position:static;margin-left:2px}
html.desk nav.tabs{justify-content:safe center}
@media (max-width:440px){html.desk nav.tabs .tab{font-size:10.5px;letter-spacing:-.01em}}
/* al computer niente righe che scorrono di lato senza barra: i filtri vanno a capo */
html.desk .chips{flex-wrap:wrap;overflow-x:visible}
html.desk .chips.sugg{flex-wrap:wrap;overflow:hidden;max-height:86px;align-items:center}
html.desk main{padding-bottom:260px!important}
@media (max-width:820px){
  html.desk .tab{flex:1 1 0;min-width:0;flex-direction:column;height:60px;padding:0 2px;font-size:12px;gap:3px;position:relative;overflow:hidden;text-overflow:ellipsis}
  html.desk .tab .badge{position:absolute;top:6px;left:calc(50% + 6px);margin-left:0}
  html.desk nav.tabs{gap:0;padding-left:4px;padding-right:4px}
  html.desk main{padding-top:80px!important}
}
html.desk .fab{bottom:28px!important}
html.desk .toast{bottom:32px!important}
html.desk .scrim{align-items:center;padding:24px}
html.desk .sheet{border-radius:20px;max-height:88vh;max-width:640px}
html.desk .ngrid{grid-template-columns:repeat(3,minmax(0,1fr))}
html.desk .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
</style>
<script>try{if(window.parent!==window&&window.parent.__GELU_HOME__){var r=document.documentElement;r.classList.add('in-home');if(window.parent.__GELU_HOME__.desk)r.classList.add('desk');var t=window.parent.__GELU_HOME__.tema;if(t&&t!=='auto')r.setAttribute('data-theme',t);var z=window.parent.__GELU_HOME__.zoom;if(z&&z!=1)r.style.zoom=z}}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="brand-mark" src="icon-192.png" alt="">
    <h1>Spesa</h1>

  o.v = 1; return o;
}

function learn(it, extra = {}){
  const k = norm(it.nome); if (!k) return;
  const p = S.prodotti[k] || {nome:it.nome, rep:it.rep, prezzo:null, unita:it.unita || '', volte:0, ultima:null, ab:false};
  p.nome = it.nome; p.rep = it.rep || p.rep;
  if (it.prezzo > 0){ p.prezzo = it.prezzo; p.unita = famiglia(it.unita); }
  Object.assign(p, extra); delete p.esempio;
  S.prodotti[k] = p;
}
function addToList(text, fromProd){
  const L = lista();
  const parsed = fromProd ? {nome:fromProd.nome, qta:null, unita:''} : parseLine(text);
  if (!parsed) return null;
  const k = norm(parsed.nome), p = S.prodotti[k];
  const ex = L.items.find(i => norm(i.nome) === k);
  if (ex){
    if (ex.ok){ ex.ok = false; if (parsed.qta){ ex.qta = parsed.qta; ex.unita = parsed.unita; } return {it:ex, msg:`${ex.nome}: di nuovo da prendere`}; }
    if (parsed.qta && (ex.unita || '') === (parsed.unita || '')){ ex.qta = Math.round(((ex.qta || 1) + parsed.qta) * 1000) / 1000; return {it:ex, msg:`${ex.nome}: ora ${fmtQta(ex)}`}; }
    if (parsed.qta){ ex.qta = parsed.qta; ex.unita = parsed.unita; if (famiglia(ex.unita) !== (S.prodotti[k]?.unita || '')) ex.prezzo = null; return {it:ex, msg:`${ex.nome}: ${fmtQta(ex)}`}; }
    return {it:ex, msg:`${ex.nome} è già in lista`};
  }
  const it = {id:uid(), nome:p ? p.nome : parsed.nome, qta:parsed.qta, unita:parsed.unita || '', rep:guessRep(parsed.nome), prezzo:null, ok:false, nota:''};
  if (p && p.prezzo && famiglia(it.unita) === (p.unita || '')) it.prezzo = p.prezzo;
  L.items.push(it);
  if (!p) learn(it); else if (!p.rep) p.rep = it.rep;
  delete L.esempio;
  return {it, msg:`Aggiunto: ${it.nome}${it.qta ? ' (' + fmtQta(it) + ')' : ''}`};
}

/* ---------- ti sta finendo? ---------- */
const dayDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
function finishing(){
  const t = today(), inList = new Set(S.liste.flatMap(l => l.items.filter(i => !i.ok).map(i => norm(i.nome))).concat(S.dispensa.map(d => norm(d.nome))));
  const dates = {};
  for (const x of S.storico) for (const i of x.items){ const k = norm(i.nome); (dates[k] ||= new Set()).add(x.data); }
  const out = [];
  for (const k in dates){
    const p = S.prodotti[k]; if (!p || inList.has(k)) continue;
    if (S.snooze[k] && S.snooze[k] > t) continue;
    const d = [...dates[k]].sort(); if (d.length < 3) continue;
    const gaps = []; for (let i = 1; i < d.length; i++) gaps.push(dayDiff(d[i-1], d[i]));
    gaps.sort((a, b) => a - b);
    const med = gaps[Math.floor(gaps.length / 2)], since = dayDiff(d[d.length - 1], t);
    if (med < 2 || since < med * 0.9) continue;
    out.push({k, nome:p.nome, rep:p.rep, med, since, r:since / med});
  }
  return out.sort((a, b) => b.r - a.r);
}
function finishingBlock(){
  const f = finishing(); if (!f.length || V.shop) return '';
  const shown = f.slice(0, 5);
  return `<section class="block fin"><div class="block-head"><h3>Forse ti serve</h3><button class="linkbtn" data-act="addFinishing">Aggiungi ${f.length === 1 ? 'tutto' : `tutti e ${Math.min(f.length, 5)}`}</button></div>
    <div class="list">${shown.map(x => `<div class="row"><span class="dot" style="background:${REP[x.rep]?.col || '#8A96A3'}"></span>
      <div class="main"><div class="t">${esc(x.nome)}</div><div class="s">Di solito ogni ${x.med} giorni, l'ultima volta ${x.since} giorni fa</div></div>
      <button class="snz" data-snooze="${esc(x.k)}">Non ora</button>
      <button class="ed" data-padd="${esc(x.k)}" aria-label="Aggiungi ${esc(x.nome)}" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>`).join('')}</div></section>`;
}

function readInbox(){
  let a = [];
  try { a = JSON.parse(localStorage.getItem(MY_INBOX) || '[]'); } catch(_){ return 0; }
  if (!Array.isArray(a) || !a.length) return 0;
  const names = []; let moved = 0;
  for (const x of a){
    if (!x || !x.nome) continue;
    if (x.tipo === 'dispensa'){
      let qta = null, unita = '', nota = '';
      if (x.qta){ const pr = parseLine(`${x.qta} ${x.nome}`); if (pr && pr.qta && norm(pr.nome) === norm(x.nome)){ qta = pr.qta; unita = pr.unita; } else nota = String(x.qta); }
      dispAdd({nome:cap(x.nome), dove:DV[x.dove] ? x.dove : 'dispensa', qta, unita, scade:x.scade || null, nota}); moved++;
      continue;
    }
    const r = addToList(`${x.qta ? x.qta + ' ' : ''}${x.nome}`); if (r) names.push(r.it.nome);
  }
  try { localStorage.removeItem(MY_INBOX); } catch(_){}
  if (names.length || moved){ save(); setTimeout(() => toast(moved ? `La dispensa di Soldi è arrivata qui: ${moved} ${moved === 1 ? 'prodotto' : 'prodotti'}` : `Aggiunti: ${names.slice(0, 3).join(', ')}${names.length > 3 ? ` e altri ${names.length - 3}` : ''} in «${lista().nome}»`), 400); }
  return names.length + moved;
}

/* ---------- dettatura ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const NUMW = {un:1, uno:1, una:1, due:2, tre:3, quattro:4, cinque:5, sei:6, sette:7, otto:8, nove:9, dieci:10, undici:11, dodici:12, quindici:15, venti:20, trenta:30};
function voiceToLines(text){
  let t = ' ' + String(text).toLowerCase().replace(/[.!?]/g, ' ') + ' ';
  t = t.replace(/\b(una|mezza)\s+dozzina\s+(di\s+)?/g, (m, w) => (w === 'una' ? '12 ' : '6 '))
       .replace(/\bun\s+chilo\s+e\s+mezzo\b/g, '1.5 kg').replace(/\bun\s+litro\s+e\s+mezzo\b/g, '1.5 l')
       .replace(/\b(un|uno|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|undici|dodici|quindici|venti|trenta)\s+(?=\S)/g, (m, w) => NUMW[w] + ' ')
       .replace(/\b(\d+)\s+e\s+mezzo\b/g, (m, n) => n + '.5')
       .replace(/\b(mezzo|mezza)\s+(chilo|chili|kg|litro|litri)\b/g, '0.5 $2');
  return t.split(/\s*,\s*|\s+e\s+|\s+ed\s+|\s+poi\s+|\s+più\s+|\s+anche\s+/).map(x => x.replace(/^\s*(e|poi|anche|del|della|dei|delle|degli|il|lo|la|i|gli|le)\s+/, '').trim()).filter(x => x && x.length > 1 && !/^\d+([.,]\d+)?$/.test(x));
}
let rec = null;
function voice(){
  const btn = $('#micBtn'), inp = $('#addIn');
  if (rec){ try { rec.stop(); } catch(_){} return; }
  try { rec = new SR(); } catch(_){ toast('La dettatura non è disponibile su questo telefono'); return; }
  rec.lang = 'it-IT'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = '';
  btn.classList.add('on'); btn.setAttribute('aria-label', 'Smetti di ascoltare');
  inp.value = ''; inp.placeholder = 'Ti ascolto… es. latte, pane e due chili di mele';
  rec.onresult = e => { let tx = ''; for (let i = 0; i < e.results.length; i++){ tx += e.results[i][0].transcript; if (e.results[i].isFinal) finalText = tx; } inp.value = tx; };
  rec.onerror = e => {
    const m = {'not-allowed':'Il microfono non è permesso: consentilo a Chrome per questo sito e riprova.', 'service-not-allowed':'Il microfono non è permesso: consentilo a Chrome per questo sito e riprova.', 'no-speech':'Non ho sentito niente: tocca il microfono e riprova.', 'network':'Per la dettatura serve la connessione a internet.', 'audio-capture':'Non trovo il microfono del telefono.'}[e.error];
    if (m) toast(m);
  };
  rec.onend = () => {
    btn.classList.remove('on'); btn.setAttribute('aria-label', 'Detta la lista a voce'); inp.placeholder = 'Aggiungi, es. 2 latte o 1 kg mele';
    const text = finalText || inp.value; rec = null;
    if (!text.trim()) return;
    const lines = voiceToLines(text), names = [];
    const snap = snapshot();
    for (const l of lines){ const r = addToList(l); if (r) names.push(r.it.nome); }
    inp.value = ''; save(); keepScroll(render);
    if (names.length){ toast(`Aggiunti: ${names.join(', ')}`); offerUndo(snap); } else toast('Non ho capito, riprova');
  };
  try { rec.start(); } catch(_){ btn.classList.remove('on'); rec = null; toast('La dettatura non è disponibile ora: riprova'); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
let toastT, undoSnap = null;
function toast(msg){ $('#toast-t').textContent = msg; $('#toast-u').hidden = true; undoSnap = null; $('#toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $('#toast').hidden = true, 2600); }
const snapshot = () => JSON.stringify(S);
function offerUndo(snap){ undoSnap = snap; $('#toast-u').hidden = false; $('#toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { $('#toast').hidden = true; undoSnap = null; }, 6000); }
$('#toast-u').addEventListener('click', () => { if (!undoSnap) return; S = JSON.parse(undoSnap); undoSnap = null; save(); applyTheme(); closeSheet(); render(); toast('Ripristinato'); });
function twoTap(btn, label, fn){

    const snap = snapshot(); fn(); offerUndo(snap);

}

const unitSelect = (id, sel) => `<select id="${id}">${[['', 'nessuna'], ['pz', 'pezzi'], ['conf', 'confezioni'], ['kg', 'kg'], ['hg', 'etti'], ['g', 'grammi'], ['l', 'litri'], ['ml', 'ml'], ['bott', 'bottiglie'], ['vas', 'vasetti']].map(([v, l]) => `<option value="${v}" ${v === (sel || '') ? 'selected' : ''}>${l}</option>`).join('')}</select>`;

/* ---------- dispensa ---------- */
function dispAdd(o){
  const k = norm(o.nome), ex = S.dispensa.find(d => norm(d.nome) === k && d.dove === o.dove);
  if (ex){
    if (o.qta && ex.qta && (ex.unita || '') === (o.unita || '')) ex.qta = Math.round((ex.qta + o.qta) * 1000) / 1000;
    else if (o.qta){ ex.qta = o.qta; ex.unita = o.unita || ''; }
    if (o.scade && (!ex.scade || o.scade < ex.scade)){ ex.scade = o.scade; ex.stima = !!o.stima; }
    delete ex.esempio; return ex;
  }
  const d = {id:uid(), nome:o.nome, dove:o.dove || 'dispensa', qta:o.qta || null, unita:o.unita || '', scade:o.scade || null, stima:!!o.stima, nota:o.nota || ''};
  S.dispensa.push(d); return d;
}
function fromPurchase(i, data){
  const dove = doveOf(i.rep), o = {nome:i.nome, dove, qta:i.qta, unita:i.unita};
  if (S.stimaScad){ const n = shelfDays(i.rep, i.nome); if (n){ const t = parseD(data || today()); t.setDate(t.getDate() + n); o.scade = iso(t); o.stima = true; } }
  return dispAdd(o);
}
const dispSoon = days => { const t = new Date(); t.setDate(t.getDate() + days); const L = iso(t); return S.dispensa.filter(d => d.scade && d.scade <= L).sort((a, b) => a.scade.localeCompare(b.scade)); };
function scadPill(d){
  if (!d.scade) return '';
  const n = dayDiff(today(), d.scade), c = d.stima ? 'circa ' : '';
  const st = n < 0 ? {c:'bad', t:n === -1 ? 'Scaduto ieri' : `Scaduto da ${-n} gg`} : n === 0 ? {c:'bad', t:'Scade oggi'} : n <= 3 ? {c:'warn', t:n === 1 ? `${c}domani` : `${c}tra ${n} gg`} : {c:'ok', t:`${c}${n > 300 ? fmtLong(d.scade) : fmtShort(d.scade)}`};
  return `<span class="pill ${st.c}">${st.t}</span>`;
}
function dispRow(d, showDove = true){
  return `<div class="row"><span class="dot" style="background:${DV[d.dove].col}"></span>
    <div class="main" data-dedit="${d.id}" role="button" tabindex="0" style="cursor:pointer"><div class="t">${d.qta || d.unita ? `<span class="qta">${esc(fmtQta(d))}</span> ` : ''}${esc(d.nome)}</div>${(() => { const sub = [showDove ? DV[d.dove].nome : '', d.nota ? esc(d.nota) : '', d.esempio ? 'esempio' : ''].filter(Boolean).join(' · '); return sub ? `<div class="s">${sub}</div>` : ''; })()}</div>
    ${scadPill(d)}<button class="snz" data-dfin="${d.id}" style="color:var(--accent)">Finito</button></div>`;
}
function renderDispensa(){
  const f = V.dove, all = S.dispensa;
  const sorter = (a, b) => (a.scade || '9999').localeCompare(b.scade || '9999') || a.nome.localeCompare(b.nome);
  const soon = dispSoon(2);

/* ---------- cosa ho dimenticato? ---------- */
function forgotten(L){
  const fin = new Set(finishing().map(f => f.k));
  return L.items.filter(i => !i.ok).map(i => {
    const p = S.prodotti[norm(i.nome)];
    const usual = !!(p && (p.ab || (p.volte || 0) >= 3 || fin.has(norm(i.nome))));
    return {i, usual};
  }).sort((a, b) => (b.usual ? 1 : 0) - (a.usual ? 1 : 0));
}

/* ---------- fine spesa ---------- */

function sendToBilancino(trip){

/* ---------- condividi e importa ---------- */
function listText(){
  const L = lista(), todo = L.items.filter(i => !i.ok);
  const lines = [`${L.nome}`];
  for (const r of S.ordine){ const g = todo.filter(i => i.rep === r); if (!g.length) continue; lines.push('', REP[r].nome.toUpperCase()); for (const i of g) lines.push(`- ${i.qta || i.unita ? fmtQta(i) + ' ' : ''}${i.nome}${i.nota ? ' (' + i.nota + ')' : ''}`); }
  return lines.join('\n');
}
function waText(){
  const L = lista(), todo = L.items.filter(i => !i.ok);
  const lines = [`🛒 *${L.nome}* · ${todo.length} ${todo.length === 1 ? 'cosa' : 'cose'}`];
  for (const r of S.ordine){

  },
  report(y, m){
    const ym = `${y}-${String(m + 1).padStart(2, '0')}`, l = S.storico.filter(x => x.data.startsWith(ym)), tot = l.reduce((t, x) => t + (x.totale || 0), 0);
    return {rows:[['Spese fatte', String(l.length)], ['Totale scontrini', tot.toLocaleString('it-IT', {style:'currency', currency:'EUR'})]], note:''};
  },
  show(){ try { readInbox(); if (!sheetEl) keepScroll(render); } catch(_){} },
  summary(){
    const l = lista(), todo = l.items.filter(i => !i.ok), t = today();
    const dd = x => Math.round((new Date(x + 'T00:00') - new Date(t + 'T00:00')) / 864e5);
    const exp = S.dispensa.filter(x => x.scade && dd(x.scade) <= 3).sort((a, b) => a.scade.localeCompare(b.scade));
    const items = todo.slice(0, 6).map(i => ({tog:i.id, t:i.nome, s:[i.qta ? `${String(i.qta).replace('.', ',')}${i.unita ? ' ' + i.unita : ''}` : '', i.nota || ''].filter(Boolean).join(' · ') || 'Da prendere', go:{tab:'lista'}}));
    if (todo.length > 6) items.push({t:`e altre ${todo.length - 6} cose`, s:'Apri la lista', go:{tab:'lista'}});
    exp.forEach(x => { const n = dd(x.scade); items.push({t:x.nome, s:n < 0 ? 'Scaduto in dispensa' : n === 0 ? 'Scade oggi' : n === 1 ? 'Scade domani' : `Scade tra ${n} giorni`, cls:n <= 0 ? 'bad' : 'warn', go:{tab:'dispensa'}}); });
    return {head:l.nome, kpi:[{l:'Da prendere', v:String(todo.length)}, {l:'Già presi', v:String(l.items.length - todo.length)}, {l:'In scadenza', v:String(exp.length), cls:exp.length ? 'warn' : ''}], items, empty:'La lista è vuota.'};
  },
  go(g){
    g = g || {};
    if (g.tab) goTab(g.tab);
    if (g.act){ const b = document.createElement('button'); b.type = 'button'; b.dataset.act = g.act; b.hidden = true; $('#view').appendChild(b); b.click(); b.remove(); }
  },
  azione(a){ try { history.replaceState(null, '', '?azione=' + a); } catch(_){} handleAzione(); },
  setTheme(t){ S.tema = t; save(); applyTheme(); },
  setDesk(on){ document.documentElement.classList.toggle('desk', !!on); }
};
})();
</script>
</body>
