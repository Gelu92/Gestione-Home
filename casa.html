<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Casa, sezione di Home">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Casa</title>
<meta name="theme-color" content="#2C5F8D">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app a una colonna; header in alto, schede in basso, pulsante + flottante */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --sunk:#E3E9EF; --ink:#16212B; --muted:#5B6976; --line:#D3DCE4;
  --accent:#2C5F8D; --accent-ink:#FFFFFF; --accent-soft:#DAE6F1; --green:#2E8A5C; --green-soft:#D8EEE2; --gold:#E9B44C;
  --warn:#A8690F; --warn-soft:#FBEBCF; --bad:#C2412D; --bad-soft:#F8DDD7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#172029; --sunk:#111820; --ink:#E4EBF1; --muted:#93A2AF; --line:#28333E;
  --accent:#74AADB; --accent-ink:#081A2B; --accent-soft:#1A3047; --green:#5CC491; --green-soft:#173A2A; --gold:#E9B44C;
  --warn:#E9B44C; --warn-soft:#3A2E16; --bad:#F07A63; --bad-soft:#3D1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#172029; --sunk:#111820; --ink:#E4EBF1; --muted:#93A2AF; --line:#28333E;
  --accent:#74AADB; --accent-ink:#081A2B; --accent-soft:#1A3047; --green:#5CC491; --green-soft:#173A2A; --gold:#E9B44C;
  --warn:#E9B44C; --warn-soft:#3A2E16; --bad:#F07A63; --bad-soft:#3D1F1A; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:30px;height:30px;border-radius:8px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-install{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;flex:none}
.btn-install svg{width:16px;height:16px}
.hdr-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.hdr-btn svg{width:20px;height:20px}
.hdr-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:370px){.brand-mark{display:none}}
@media (max-width:340px){.btn-install{padding:8px 10px;font-size:13px}}

main{max-width:640px;margin:0 auto;padding-block:14px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

.hello{display:flex;flex-direction:column;gap:2px}
.hello .d{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hello h2{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.02em;text-wrap:balance;line-height:1.15}

.sample-note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.sample-note button{border:0;background:transparent;color:var(--warn);font-weight:600;padding:4px 0;text-decoration:underline}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-size:12px;opacity:.7}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.wrap{flex-wrap:wrap;overflow:visible}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px}
.summary .k{display:flex;flex-direction:column;gap:2px;min-width:0}
.summary .big{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1}
.summary .big.bad{color:var(--bad)}
.summary .lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.barlab{grid-column:1/-1;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}

section.block{display:flex;flex-direction:column;gap:8px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block-head h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.block-head h3.bad{color:var(--bad)}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;border:0;background:none;padding:0}
.empty{color:var(--muted);font-size:14px;padding:18px 16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:16px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 12px;border-top:1px solid var(--line);min-height:60px}
.it:first-child{border-top:0}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:transparent;background:none;padding:0;transition:background .15s}
.ck svg{width:16px;height:16px}
.ck:hover{border-color:var(--green);color:var(--green)}
.it.ok .ck{background:var(--green);border-color:var(--green);color:#fff}
.it .main{flex:1;min-width:0;cursor:pointer}
.it .t{font-weight:500;overflow-wrap:anywhere}
.it .s{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.it.ok .t{text-decoration:line-through;color:var(--muted)}
.it .zbar{width:4px;align-self:stretch;border-radius:2px;flex:none;margin-left:-6px}
.who{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.snz{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px 8px;flex:none;border-radius:8px}
.snz:hover{background:var(--sunk)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.zone-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}

.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.mcard .top{display:flex;gap:6px 10px;align-items:flex-start;flex-wrap:wrap}
.mcard .top .main{flex:1 1 55%}
.seg.seg4 button{font-size:12px;padding:9px 1px}
.seg.segw{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}
.mcard .top .main{flex:1;min-width:0;cursor:pointer}
.mcard .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.mcard .s{font-size:13px;color:var(--muted)}
.mcard .life{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.mcard .life span{display:block;height:100%;border-radius:999px}
.mcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.mbtn.go{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.mbtn svg{width:16px;height:16px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-family:var(--f-display);font-weight:600} .stat small{color:var(--muted);font-size:12px}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:160px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.col .v{font-size:11px;color:var(--muted);white-space:nowrap}
.col .b{width:70%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.55;min-height:2px}
.col.cur .b{opacity:1} .col.cur .v{color:var(--ink);font-weight:600}
.col .m{font-size:12px;color:var(--muted)}
.whobar{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.whobar .r{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:center;font-size:14px}
.whobar .r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whobar .tr{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.whobar .tr i{display:block;height:100%;border-radius:999px}
.logday{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row .amt{font-weight:600;white-space:nowrap}

.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.tbtn svg{width:16px;height:16px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.green{background:var(--green);color:#fff}
.btn.wide{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:14px}
.settings{display:flex;flex-direction:column;gap:12px}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.check small{display:block;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px 2px;border-radius:9px;font-weight:600;color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.prow .sw{width:30px;height:30px}
.xbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--muted)}
.xbtn svg{width:16px;height:16px}

.fab{position:fixed;z-index:19;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));
  height:56px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(20,40,60,.28)}
.fab svg{width:22px;height:22px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;white-space:nowrap;overflow:hidden;color:var(--muted);font-weight:500;min-width:0;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
.sheet p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.field textarea{min-height:80px;font-size:14px}
.field textarea.mono{font-family:var(--f-num);font-size:12px;min-height:140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:600}
.wd button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{color:var(--bad);font-size:13px;min-height:1em}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hist{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.preset{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.preset:first-child{border-top:0}
.preset input{width:20px;height:20px;flex:none;accent-color:var(--accent);margin:0}
.preset .main{flex:1;min-width:0}
.preset .s{font-size:13px;color:var(--muted)}
.preset.have{opacity:.5}

.pill.mut{background:var(--sunk);color:var(--muted)}
.tbtn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:600;font-size:13px}
.mgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.hint{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subtog{border:1px solid var(--line);background:var(--sunk);border-radius:999px;font-size:12px;font-weight:600;padding:1px 8px;color:var(--ink)}
.subl{display:flex;flex-direction:column;gap:8px;padding:4px 14px 12px 56px;border-top:1px dashed var(--line)}
.vac{background:var(--accent-soft);border-color:transparent}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.alert button{border:0;background:none;color:var(--accent);font-weight:600;text-decoration:underline;padding:4px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;flex:none;background:var(--sunk)}
.th img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.thx{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;padding:0}
.addph{width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--accent);font-weight:600;cursor:pointer;background:var(--surface)}
.addph svg{width:22px;height:22px}

function toast(msg){ $('#toast-t').textContent = msg; $('#toast-u').hidden = true; $('#toast-u').textContent = 'Annulla'; $('#toast-u').onclick = null; undoSnap = null; $('#toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $('#toast').hidden = true, 2600); }

function recordDone(f, chi, extra = {}){
  const t = today(), who = chi || f.chi || (S.multi ? (V.chi || '') : 'p-io'), pt = Math.max(5, Number(f.durata) || 10);
  S.fatti.push(Object.assign({id:'x-' + uid(), d:t, tipo:'f', ref:f.id, nome:f.nome, chi:who, pt}, extra));
  f.ultimo = t; f.prossima = nextDue(f, t); f.subOk = []; V.open.delete(f.id);
  /* i tempi veri della modalità pulizie aggiornano la stima */
  if (extra.min){ const r = S.fatti.filter(x => x.ref === f.id && x.min).slice(-3).map(x => x.min); f.durata = Math.max(1, Math.round(r.reduce((a, b) => a + b, 0) / r.length)); }
  let msg = f.unita === 'q' ? 'Fatto! Segnata come fatta oggi' : `Fatto! Prossima volta: ${dueLabel(f.prossima)}`;
  if (S.multi && f.rota && S.persone.length > 1){
    const i = S.persone.findIndex(p => p.id === (who || f.chi));
    f.chi = S.persone[(i + 1) % S.persone.length].id;
    msg += `, tocca a ${persona(f.chi).nome}`;
  }
  if (S.multi && who && S.persone.length > 1) msg += ` · +${pt} punti`;
  return msg;
}
function doneF(id, chi){
  const f = S.faccende.find(x => x.id === id); if (!f) return;
  const snap = snapshot(), msg = recordDone(f, chi);
  save(); keepScroll(render); toast(msg); offerUndo(snap);
}
function tryDone(id){
  const f = S.faccende.find(x => x.id === id); if (!f) return;
  if (S.multi && S.persone.length > 1 && !f.chi && !V.chi) return pickWho('Chi l’ha fatta?', who => doneF(id, who));
  doneF(id);
}
function undone(xid){
  const x = S.fatti.find(y => y.id === xid); if (!x) return;
  const snap = snapshot();
  S.fatti = S.fatti.filter(y => y !== x);
  const f = x.tipo === 'f' && S.faccende.find(y => y.id === x.ref);
  /* se era l'ultima volta registrata, la scadenza torna com'era */
  if (f && f.ultimo === x.d && x.d === today()){
    const prev = S.fatti.filter(y => y.ref === f.id).map(y => y.d).sort().pop();
    f.ultimo = prev || ''; f.prossima = f.unita === 'q' ? FAR : x.d;
  }
  save(); keepScroll(render); toast('Tolto dal registro'); offerUndo(snap);
}

  openSheet(`<h2>Rimanda</h2><p>«${esc(f.nome)}»</p>

/* ---------- stagioni e vacanze ---------- */
function seasonFix(){
  const first = today().slice(0, 8) + '01', prevM = ((curM() + 10) % 12) + 1;
  let ch = false;
  for (const x of S.faccende.concat(S.manut)) if (seasonal(x) && x.mesi.includes(curM()) && !x.mesi.includes(prevM) && x.prossima < first){ x.prossima = x.unita === 'w' ? firstDue(x) : today(); ch = true; }
  return ch;
}
function vacFix(){
  if (!S.vacanza || today() <= S.vacanza.al) return 0;
  const late = S.faccende.filter(f => !f.pausa && f.prossima < today()).sort((a, b) => (Number(a.durata) || 0) - (Number(b.durata) || 0));
  late.forEach((f, i) => { f.prossima = f.unita === 'w' ? firstDue(f) : plus(today(), i % 3); });
  S.vacanza = null; S.partOk = [];
  return late.length || -1;
}

/* ---------- carico dei giorni ---------- */
function occ(f, from, to){
  if (f.pausa) return [];
  const x = Object.assign({}, f), out = [];
  let d = f.prossima < today() ? today() : f.prossima, g = 0;
  while (d <= to && g++ < 400){ if (d >= from && inSeason(f, d)) out.push(d); x.prossima = d; d = nextDue(x, d); }
  return out;
}
function dayLoads(n, exclude, from = today()){
  const to = plus(from, n - 1), L = {};
  for (let i = 0; i < n; i++) L[plus(from, i)] = 0;
  S.faccende.forEach(f => { if (f.id !== exclude) occ(f, from, to).forEach(d => { if (d in L) L[d] += Number(f.durata) || 10; }); });
  return L;
}
function bestDay(span, loads){
  let best = today(), bl = Infinity;
  for (let i = 0; i < span; i++){ const d = plus(today(), i), l = loads[d] ?? 0; if (l < bl){ bl = l; best = d; } }
  return [best, bl];
}

const FOTO = new Map();
let dbP = null;
function idb(){
  return dbP ||= new Promise((res, rej) => {
    try { const r = indexedDB.open('gelu-inc-casa-foto', 1); r.onupgradeneeded = () => r.result.createObjectStore('foto'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
}
async function fotoLoadAll(){
  try {
    const db = await idb();
    await new Promise(res => {
      const req = db.transaction('foto').objectStore('foto').openCursor();
      req.onsuccess = () => { const c = req.result; if (c){ FOTO.set(c.key, c.value); c.continue(); } else res(); };
      req.onerror = () => res();
    });
  } catch(_){}
}
async function fotoPut(id, data){ FOTO.set(id, data); try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('foto', 'readwrite'); tx.objectStore('foto').put(data, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch(_){} }
async function fotoDel(id){ FOTO.delete(id); try { const db = await idb(); db.transaction('foto', 'readwrite').objectStore('foto').delete(id); } catch(_){} }
function fotoCleanup(){ setTimeout(() => { const used = new Set([...S.apparecchi, ...S.manut, ...S.lavori, ...S.note].flatMap(x => x.foto || [])); for (const id of [...FOTO.keys()]) if (!used.has(id)) fotoDel(id); }, 8000); }
function compressImage(file, max = 1280){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function viewImage(src){
  if (!src) return;
  const el = document.createElement('div'); el.id = 'viewer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Foto, tocca per chiudere');
  el.innerHTML = `<img src="${src}" alt="">`; el.addEventListener('click', () => el.remove()); document.body.appendChild(el);
}

const thumbs = (ids, edit) => (ids || []).filter(id => FOTO.has(id)).map(id => `<span class="th"><img src="${FOTO.get(id)}" data-view="${id}" alt="Foto">${edit ? `<button type="button" class="thx" data-phdel="${id}" aria-label="Togli la foto">×</button>` : ''}</span>`).join('');
const fotoBlock = ids => `<div class="field"><span class="lab">Foto</span><div class="thumbs" id="ph-box">${thumbs(ids, true)}<label class="addph">${CAM}<span>Aggiungi</span><input type="file" accept="image/*" id="ph-in" multiple hidden></label></div></div>`;
function fotoWire(root, arr){
  const box = root.querySelector('#ph-box'), inp = root.querySelector('#ph-in');

function periodi(l){ const out = []; for (let i = 1; i < l.length; i++){ const g = Math.max(1, diff(l[i].data, l[i - 1].data)), q = l[i].valore - l[i - 1].valore; out.push({da:l[i - 1].data, a:l[i].data, g, q, mese:q / g * 30}); } return out; }

/* ---------- calendario ---------- */
function calData(from, to){
  const M = {}, add = (d, k, x) => { (M[d] = M[d] || {due:[], done:[]})[k].push(x); };
  const t = today(), f0 = from < t ? t : from;
  if (f0 <= to && !(S.vacanza && S.vacanza.al >= to && S.vacanza.dal <= f0)){
    S.faccende.forEach(f => occ(f, f0, to).forEach(d => { if (!(S.vacanza && d >= S.vacanza.dal && d <= S.vacanza.al)) add(d, 'due', {nome:f.nome, col:zona(f.zona).col, min:Number(f.durata) || 0, id:f.id, k:'f'}); }));
    S.manut.forEach(m => { if (!inSeason(m)) return; const d = m.prossima < t ? t : m.prossima; if (d >= f0 && d <= to) add(d, 'due', {nome:m.nome, col:(MT[m.tipo] || MT.altro).col, id:m.id, k:'m'}); });
    openL().forEach(l => { if (!l.entro) return; const d = l.entro < t ? t : l.entro; if (d >= f0 && d <= to) add(d, 'due', {nome:l.titolo, col:'#C9A227', id:l.id, k:'l'}); });
  }
  S.fatti.forEach(x => { if (x.d >= from && x.d <= to) add(x.d, 'done', x); });
  return M;
}

    const dots = x.done.slice(0, 4).map(() => 'var(--green)').concat(x.due.map(e => e.col)).slice(0, 4);

    <div class="cal"><div class="cw">${['L','M','M','G','V','S','D'].map(g => `<span>${g}</span>`).join('')}</div><div class="cg">${cells.join('')}</div></div>

    ${x.done.length || x.due.length ? `<div class="list">${x.done.map(e => `<div class="row"><span class="dot" style="background:var(--green)"></span><div class="main"><div class="t">${esc(e.nome)}</div><div class="s">${e.tipo === 'l' ? 'Fatto' : 'Fatta'}${S.multi && persona(e.chi) ? ' da ' + esc(persona(e.chi).nome) : ''}${e.min ? ` in ${e.min} min` : ''}</div></div>${e.costo ? `<span class="amt num">${eur.format(e.costo)}</span>` : ''}</div>`).join('')}${x.due.map(e => `<div class="row"><span class="dot" style="background:${e.col}"></span><div class="main"><div class="t">${esc(e.nome)}</div><div class="s">${kindL[e.k]}${e.min ? ` · ${e.min} min` : ''}</div></div></div>`).join('')}</div>`

/* ---------- riepilogo della settimana ---------- */
function weekBase(){ const g = new Date().getDay(); return g === 0 ? weekStart() : g === 1 ? plus(weekStart(), -7) : null; }
function weekInfo(ws){
  const we = plus(ws, 6), F = S.fatti.filter(x => x.tipo === 'f' && x.d >= ws && x.d <= we);
  const prev = S.fatti.filter(x => x.tipo === 'f' && x.d >= plus(ws, -7) && x.d < ws).length;
  const minT = F.reduce((s, x) => s + (x.min || Number((S.faccende.find(f => f.id === x.ref) || {}).durata) || 0), 0);
  return {F, prev, minT, giorni:new Set(F.map(x => x.d)).size};
}

  const dl = F.length - prev;
  const per = S.multi && S.persone.length > 1 ? S.persone.map(p => [p, F.filter(x => x.chi === p.id).reduce((s, x) => s + (x.pt || 10), 0)]).sort((a, b) => b[1] - a[1]) : [];
  if (weekBase() === ws && S.weekSeen !== ws){ S.weekSeen = ws; save(); keepScroll(render); }

    <div class="stats">
      <div class="stat"><small>Faccende fatte</small><b class="num">${F.length}</b><small>${prev || F.length ? (dl > 0 ? `${dl} più della settimana prima` : dl < 0 ? `${-dl} meno della settimana prima` : 'come la settimana prima') : ''}</small></div>

    </div>
    ${top.length ? `<p style="font-size:14px">La più fatta: «${esc(top[0][0])}»${top[0][1] > 1 ? ` (${top[0][1]} volte)` : ''}.</p>` : ''}

/* ---------- consumi: confronto con l'anno scorso ---------- */
function valAt(l, d){
  if (!l.length || d < l[0].data || d > l[l.length - 1].data) return null;
  for (let i = 0; i < l.length; i++){
    if (l[i].data === d) return l[i].valore;
    if (l[i].data > d){ const a = l[i - 1], b = l[i]; return a.valore + (b.valore - a.valore) * diff(d, a.data) / Math.max(1, diff(b.data, a.data)); }
  }
  return null;
}
const useBetween = (l, a, b) => { const x = valAt(l, a), y = valAt(l, b); return x == null || y == null ? null : y - x; };
function yoy(l){
  if (l.length < 2) return null;
  const e = l[l.length - 1].data, s = plus(e, -30), e1 = addInt(e, -1, 'a'), s1 = plus(e1, -30);
  const now = useBetween(l, s, e), then = useBetween(l, s1, e1);
  return now == null || then == null || then <= 0 ? null : {now, then, pct:Math.round((now - then) / then * 100)};
}
function monthCompare(l){
  const out = [], d0 = parseD(today()); d0.setDate(1);
  for (let k = 1; k <= 6; k++){
    const a = new Date(d0); a.setMonth(a.getMonth() - k); const b = new Date(a); b.setMonth(b.getMonth() + 1);
    const a1 = new Date(a); a1.setFullYear(a1.getFullYear() - 1); const b1 = new Date(b); b1.setFullYear(b1.getFullYear() - 1);
    const now = useBetween(l, iso(a), iso(b)), then = useBetween(l, iso(a1), iso(b1));
    if (now != null && then != null) out.push({mese:a, now, then, pct:then > 0 ? Math.round((now - then) / then * 100) : null});
  }
  return out;
}
const pctPill = (p, short) => p == null ? '' : `<span class="pill ${p > 5 ? 'warn' : p < -5 ? 'ok' : 'mut'}">${p > 0 ? '+' : p < 0 ? '−' : ''}${Math.abs(p)}%${short ? '' : ' sull’anno scorso'}</span>`;

/* ---------- quanto costa la casa ---------- */
function costRows(y){
  const out = [];
  S.fatti.forEach(x => {
    if (!x.costo || !x.d.startsWith(y)) return;
    if (x.tipo === 'm'){ const m = S.manut.find(z => z.id === x.ref); out.push({d:x.d, tipo:'Manutenzione', voce:x.nome, cat:(MT[m && m.tipo] || MT.altro).nome, col:(MT[m && m.tipo] || MT.altro).col, importo:x.costo}); }
    else if (x.tipo === 'l'){ const l = S.lavori.find(z => z.id === x.ref), z = l && S.zone.find(q => q.id === l.zona); out.push({d:x.d, tipo:'Lavoro', voce:x.nome, cat:'Lavori' + (z ? ' · ' + z.nome : ''), col:'#C9A227', importo:x.costo}); }
  });
  S.apparecchi.forEach(a => { if (a.prezzo && (a.acquisto || '').startsWith(y)) out.push({d:a.acquisto, tipo:'Acquisto', voce:a.nome, cat:'Apparecchi', col:'#7A6FD0', importo:Number(a.prezzo)}); });
  return out.sort((a, b) => b.d.localeCompare(a.d));
}
function costYears(){ const ys = new Set([today().slice(0, 4)]); S.fatti.forEach(x => { if (x.costo) ys.add(x.d.slice(0, 4)); }); S.apparecchi.forEach(a => { if (a.prezzo && a.acquisto) ys.add(a.acquisto.slice(0, 4)); }); return [...ys].sort(); }
function costSheet(y){
  y = y || today().slice(0, 4);
  const R = costRows(y), tot = R.reduce((s, r) => s + r.importo, 0), ys = costYears(), i = ys.indexOf(y);
  const by = k => Object.values(R.reduce((o, r) => { const key = r[k]; (o[key] = o[key] || {nome:key, col:r.col, v:0, n:0}).v += r.importo; o[key].n++; return o; }, {})).sort((a, b) => b.v - a.v);
  const tipi = by('tipo'), cats = by('cat'), cm = Math.max(1, ...cats.map(c => c.v));
  const mesi = MESI.map((_, k) => R.filter(r => Number(r.d.slice(5, 7)) === k + 1).reduce((s, r) => s + r.importo, 0)), mm = Math.max(1, ...mesi);
  const prevTot = i > 0 ? costRows(ys[i - 1]).reduce((s, r) => s + r.importo, 0) : null;
  openSheet(`<div class="calhead"><button class="xbtn" type="button" data-cy="${ys[i - 1] || ''}" ${i > 0 ? '' : 'disabled'} aria-label="Anno precedente">‹</button><h3>Quanto costa la casa · ${y}</h3><button class="xbtn" type="button" data-cy="${ys[i + 1] || ''}" ${i < ys.length - 1 ? '' : 'disabled'} aria-label="Anno successivo">›</button></div>
    <div class="stat"><small>Totale ${y}</small><b class="num" style="font-size:28px">${eur.format(tot)}</b>${prevTot != null && prevTot > 0 ? `<small>${ys[i - 1]}: ${eur.format(prevTot)}</small>` : ''}</div>
    ${R.length ? `<div class="stats">${['Manutenzione','Lavoro','Acquisto'].map(t => { const x = tipi.find(q => q.nome === t); return `<div class="stat"><small>${{Manutenzione:'Manutenzioni', Lavoro:'Lavori', Acquisto:'Apparecchi comprati'}[t]}</small><b class="num">${eur.format(x ? x.v : 0)}</b></div>`; }).join('')}</div>
    <div class="sub">Per voce</div>
    <div class="whobar">${cats.map(c => `<div class="r" style="grid-template-columns:minmax(0,1.3fr) 1fr auto"><span>${esc(c.nome)}</span><span class="tr"><i style="width:${Math.round(c.v / cm * 100)}%;background:${c.col}"></i></span><b class="num">${eur.format(c.v)}</b></div>`).join('')}</div>
    <div class="sub">Mese per mese</div>
    <div class="trend" style="grid-template-columns:repeat(12,minmax(0,1fr));height:120px;gap:3px;padding:12px 6px 8px">${mesi.map((v, k) => `<div class="col"><div class="b" style="height:${Math.round(v / mm * 100)}%;width:80%"></div><span class="m" style="font-size:10px">${MESI[k].slice(0, 1).toUpperCase()}</span></div>`).join('')}</div>
    <div class="sub">Tutte le spese</div>
    <div class="list">${R.map(r => `<div class="row"><span class="dot" style="background:${r.col}"></span><div class="main"><div class="t">${esc(r.voce)}</div><div class="s">${fmtD(r.d, true)} · ${esc(r.cat)}</div></div><span class="amt num">${eur.format(r.importo)}</span></div>`).join('')}</div>
    <button class="btn ghost wide" id="cs-csv">Esporta in CSV (Excel)</button>`
    : '<div class="empty">Nessuna spesa registrata in questo anno. I costi arrivano dalle manutenzioni e dai lavori segnati come fatti, e dai prezzi degli apparecchi.</div>'}
    <button class="btn wide" data-close>Chiudi</button>`, root => {

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- WhatsApp ---------- */
function waText(pid){
  const p = pid && persona(pid), ok = f => !pid || f.chi === pid || !f.chi;
  const all = S.faccende.filter(f => !f.pausa && inSeason(f) && f.prossima <= today() && ok(f)).sort((a, b) => a.prossima.localeCompare(b.prossima));
  const late = all.filter(f => f.prossima < today()), tod = all.filter(f => f.prossima === today());
  const line = f => `• ${f.nome}${f.durata ? ` (${f.durata} min)` : ''}${pid && !f.chi ? ' – chi c’è' : ''}`;
  const L = [`🏠 *${p ? 'Faccende per ' + p.nome : 'Faccende di oggi'}* · ${longD(today()).toLowerCase()}`];
  if (late.length) L.push('', '⚠️ *Rimaste indietro*', ...late.map(line));
  if (tod.length) L.push('', '*Oggi*', ...tod.map(line));
  if (!all.length) L.push('', 'Oggi niente da fare 🎉');
  else if (mins(all)) L.push('', `⏱️ In tutto circa ${fmtMin(mins(all))}`);
  return L.join('\n');
}

/* ---------- backup ---------- */
function wireFile(root, name, text, mime = 'application/json'){
  const sh = root.querySelector('#x-sh');
  sh.hidden = !(navigator.canShare && window.File);
  sh.addEventListener('click', async () => {
    try { let f = new File([text], name, {type:mime}); if (!navigator.canShare({files:[f]})) f = new File([text], name.replace(/\.json$/, '.txt'), {type:'text/plain'}); if (!navigator.canShare({files:[f]})) throw 0; await navigator.share({files:[f], title:name}); toast('Condiviso'); }
    catch(e){ if (e && e.name === 'AbortError') return; toast('Condivisione non disponibile qui. Usa Scarica o Copia.'); }
  });
  root.querySelector('#x-dl').addEventListener('click', () => {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:mime})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Download avviato. Se non parte, usa Copia.'); }
    catch(_){ toast('Download non disponibile qui. Usa Copia.'); }
  });
  root.querySelector('#x-cp').addEventListener('click', async () => {
    const ta = root.querySelector('#x-ta');
    try { await navigator.clipboard.writeText(text); toast('Backup copiato'); } catch(_){ ta.focus(); ta.select(); toast('Testo selezionato: copialo dal menu'); }
  });
}

    if (fin.length) items.push({t:'Prodotti finiti', s:fin.map(x => x.nome).join(', '), cls:'warn', go:{act:'goProd'}});
    const todo = L.concat(T);
    return {head:'Oggi', kpi:[{l:'Da fare oggi', v:String(T.length)}, {l:'In ritardo', v:String(L.length), cls:L.length ? 'bad' : ''}, {l:'Tempo', v:todo.length ? fmtMin(mins(todo)) : '—'}], items, empty:'Casa in ordine, niente di urgente.', clean:todo.length > 0};
  },
  go(g){
    g = g || {};
    if (g.tab) goTab(g.tab);
    if (g.act){ const b = document.createElement('button'); b.type = 'button'; b.dataset.act = g.act; b.hidden = true; $('#view').appendChild(b); b.click(); b.remove(); }
  },
  azione(a){ try { history.replaceState(null, '', '?azione=' + a); } catch(_){} handleAzione(); },
  setTheme(t){ S.tema = t; save(); applyTheme(); },
  setDesk(on){ document.documentElement.classList.toggle('desk', !!on); }
};
})();
</script>
</body>
