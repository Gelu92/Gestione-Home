<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Soldi, sezione di Home">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Soldi</title>
<meta name="theme-color" content="#0F6B5C">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app a una colonna, header fisso in alto, barra schede in basso, pulsante + flottante */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#16202B; --muted:#5C6B7A; --line:#D6DDE4;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --accent-soft:#D6ECE6; --gold:#E2A42B;
  --ok:#2E7D5B; --warn:#A8690F; --warn-soft:#FBEBCF; --bad:#C2412D; --bad-soft:#F8DDD7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1418; --surface:#182027; --sunk:#121A20; --ink:#E6ECF1; --muted:#93A2B0; --line:#2A343D;
  --accent:#4CC2A8; --accent-ink:#06231D; --accent-soft:#163A33; --gold:#E9B44C;
  --ok:#5CC491; --warn:#E9B44C; --warn-soft:#3A2E16; --bad:#F07A63; --bad-soft:#3D1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#182027; --sunk:#121A20; --ink:#E6ECF1; --muted:#93A2B0; --line:#2A343D;
  --accent:#4CC2A8; --accent-ink:#06231D; --accent-soft:#163A33; --gold:#E9B44C;
  --ok:#5CC491; --warn:#E9B44C; --warn-soft:#3A2E16; --bad:#F07A63; --bad-soft:#3D1F1A; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:30px;height:30px;border-radius:8px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-install{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 12px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;flex:none}
.btn-install svg{width:16px;height:16px}
@media (max-width:340px){.brand-mark{display:none}}

main{max-width:640px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

.sample-note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px}
.sample-note button{border:0;background:transparent;color:var(--warn);font-weight:600;padding:4px 0;text-decoration:underline}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;text-transform:capitalize;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}

.total{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.total .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.total .big{font-size:38px;font-weight:600;line-height:1.05}
.meter{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.meter.over span{background:var(--bad)}
.total .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.delta-up{color:var(--bad)} .delta-down{color:var(--ok)}

section.block{display:flex;flex-direction:column;gap:10px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block-head h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.block-head a,.linkbtn{color:var(--accent);font-weight:600;font-size:14px;border:0;background:none;padding:0}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .main{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.paybtn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;flex:none}

.cats{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.cat-row .nm{display:flex;align-items:center;gap:8px;min-width:0}
.cat-row .bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.cat-row .bar span{display:block;height:100%;border-radius:999px}
.cat-row .pct{color:var(--muted);font-size:12px;margin-left:6px}

.trend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:180px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.col .v{font-size:11px;color:var(--muted);white-space:nowrap}
.col .b{width:70%;max-width:38px;border-radius:6px 6px 2px 2px;background:var(--line);min-height:2px}
.col.cur .v{color:var(--ink);font-weight:600}
.col .m{font-size:12px;color:var(--muted);text-transform:capitalize}

.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px;text-transform:capitalize}

.summary-line{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}

.settings{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;min-width:0;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{position:fixed;z-index:21;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(15,107,92,.35)}
.fab svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.meter span{transition:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
.sheet p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.field textarea{min-height:110px;font-family:var(--f-num);font-size:12px}
.amount-in{font-family:var(--f-num);font-size:28px !important;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.err{color:var(--bad);font-size:13px;min-height:1em}

.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io>div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.io b{font-size:18px}
.pair{display:flex;gap:3px;align-items:flex-end;justify-content:center;width:100%}
.pair .b{width:40%;max-width:18px;border-radius:5px 5px 2px 2px;min-height:2px}
.b.in{background:var(--accent)} .b.out{background:var(--gold)}
.col:not(.cur) .pair{opacity:.5}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:4px}
.chip.add{border-style:dashed;color:var(--accent);font-weight:600}

.seg.small button{font-size:13px;padding:8px 2px}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.note button{border:0;background:none;color:var(--accent);font-weight:600;text-decoration:underline;padding:4px 0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:17px;overflow-wrap:anywhere} .stat small{color:var(--muted);font-size:12px}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lock h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
#lock .msg{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
.pindots{display:flex;gap:14px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keypad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:26px;font-family:var(--f-num)}
.keypad .blank{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cat-row .lim{color:var(--muted);font-size:12px}
.more{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.more summary{padding:12px 0;font-weight:600;cursor:pointer;color:var(--accent);list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+ "}
.more[open] summary::before{content:"− "}
.more[open]{padding-bottom:14px}
.field textarea.plain{font-family:var(--f-body);font-size:15px;min-height:72px}
.thumbrow{display:flex;align-items:center;gap:12px}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
#viewer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}
#viewer img{max-width:100%;max-height:100%;border-radius:8px}
.card.frows{gap:0;padding:4px 16px}
.frow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.frow:first-child{border-top:0}
.frow.tot{font-size:16px}
.frow small{font-size:12px}
.frow>span:first-child{min-width:0}
.hist{display:flex;align-items:flex-end;gap:4px;height:96px;padding-top:8px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.hb{width:100%;max-width:22px;border-radius:4px 4px 1px 1px;background:var(--gold)}
.hcol:last-child .hb{background:var(--accent)}
.hl{font-size:10px;color:var(--muted)}
.minibar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:6px}
.minibar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.goal{cursor:pointer}
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calhead span{text-align:center;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cday{aspect-ratio:1/1.18;max-width:100%;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb, var(--gold) var(--h,0%), var(--surface));
  display:flex;flex-direction:column;align-items:center;padding:5px 1px 5px;gap:1px;min-width:0}
.cday .dn{font-size:13px;font-weight:600;line-height:1.2}
.cday .da{font-size:10px;line-height:1.1;max-width:100%;overflow:hidden}
.cday .dots{display:flex;gap:2px;margin-top:auto;min-height:6px}
.cday .dots i,.calleg i{width:6px;height:6px;border-radius:50%;display:inline-block}
.cday.oggi .dn{color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 6px}
.cday.sel{box-shadow:0 0 0 2px var(--ink);border-color:transparent}
.cday.blank{visibility:hidden}
.cday.fut{border-style:dashed}
.d-pay{background:var(--warn)} .d-bad{background:var(--bad)} .d-in{background:var(--accent)} .d-rem{background:var(--muted)} .d-ric{background:var(--ink)}
.calleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.calleg span{display:inline-flex;align-items:center;gap:5px}
.calleg .heat{width:14px;height:10px;border-radius:3px;background:color-mix(in srgb, var(--gold) 55%, var(--surface));border:1px solid var(--line)}
.block-head h3.dayttl{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;color:var(--ink);letter-spacing:0;text-transform:none}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.ncard{background:color-mix(in srgb, var(--nc) 13%, var(--surface));border:1px solid color-mix(in srgb, var(--nc) 38%, var(--line));border-radius:var(--r);
  padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;text-align:left}
.ncard .nt{font-weight:600;display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.ncard .nt svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--muted)}
.nbody{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--muted)}
.nitems{display:flex;flex-direction:column;gap:2px}
.nit{display:flex;gap:8px;align-items:flex-start;border:0;background:none;padding:3px 0;text-align:left;font-size:14px;width:100%;min-width:0}
.nit span:last-child{overflow-wrap:anywhere;min-width:0}
.box{width:17px;height:17px;border-radius:5px;border:2px solid var(--muted);flex:none;margin-top:1px;display:grid;place-items:center}
.box svg{width:11px;height:11px}
.nit.ok .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nit.ok span:last-child{text-decoration:line-through;color:var(--muted)}
.nfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.nmore{font-size:12px;color:var(--muted)}
.lrows{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;gap:8px;align-items:center}
.lrow input[type=checkbox]{width:22px;height:22px;flex:none;margin:0;accent-color:var(--accent)}
.lrow .lt{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.lrow .lt.ok{text-decoration:line-through;color:var(--muted)}
.lx{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:none;color:var(--muted);font-size:20px;line-height:1}
.hdr-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.hdr-btn svg{width:20px;height:20px}
.hdr-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.d-nota{background:#7A6FD0}
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.donut svg{width:150px;height:150px;max-width:100%}
.dleg{display:flex;flex-direction:column;gap:2px;min-width:0}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:none;padding:4px 6px;border-radius:8px;text-align:left;font-size:13px;width:100%}
.dl span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl.on{background:var(--sunk);font-weight:600}
@media (max-width:360px){.donut{grid-template-columns:1fr;justify-items:center}}
.cmprow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.cmprow:first-child{border-top:0}
.cmprow.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cmprow>span:not(:first-child){text-align:right}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg.a{background:var(--accent)} .lg.b{background:var(--gold)}
.profbar{margin-bottom:-4px}
.d-gar{background:#3A86C8}
.tip{display:flex;gap:10px;align-items:flex-start}
.tip svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--accent)}
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--gold);font-weight:700;padding:4px 2px;flex:none}
.wzin{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  body::before{display:none!important}
  :root{padding:0!important}
  body{background:#fff!important;color:#000!important}
  #print{display:block;font:10.5pt/1.4 var(--f-body);color:#000}
  #print h1{font-family:var(--f-display);font-size:20pt;margin:0 0 2px}
  #print h2{font-size:12pt;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  #print .meta{color:#555;margin:0 0 12px;font-size:10pt}
  #print table{width:100%;border-collapse:collapse;margin:4px 0 6px}
  #print th,#print td{border-bottom:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}
  #print th{font-size:9pt;color:#555;text-transform:uppercase;letter-spacing:.04em}
  #print .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #print table.kpi td{font-size:15pt;font-weight:600}
  #print tr{break-inside:avoid}
  @page{margin:14mm}
}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* dentro Home: l'intestazione la fa Home */
html.in-home header.top{display:none!important}
html.in-home body::before{display:none}
html.in-home .tab[data-tab="note"]{display:none}
html.in-home:not(.desk) nav.tabs{grid-template-columns:repeat(4,1fr)}

html.desk main{max-width:1040px;padding-top:78px!important;padding-bottom:110px!important}

html.desk .tab{flex-direction:row;height:56px;padding:0 18px;font-size:14px;gap:8px;flex:0 0 auto}
html.desk .tab .badge{position:static;margin-left:2px}
html.desk .fab{bottom:28px!important}
html.desk .toast{bottom:32px!important}
html.desk .scrim{align-items:center;padding:24px}
html.desk .sheet{border-radius:20px;max-height:88vh;max-width:640px}
html.desk .ngrid{grid-template-columns:repeat(3,minmax(0,1fr))}
html.desk .stats{grid-template-columns:repeat(4,minmax(0,1fr))}

function migrate(o){
  if ((o.v || 1) < 7 && Array.isArray(o.spese) && o.spese.every(x => x.esempio)){
    const fresh = seed(); fresh.budget = o.budget ?? fresh.budget; return migrate(fresh);
  }
  if (!Array.isArray(o.cats) || !o.cats.length) o.cats = DEFAULT_CATS.map(c => ({...c}));
  for (const t of ['uscita', 'entrata']) if (!o.cats.some(c => c.id === FALLBACK[t])) o.cats.push({...DEFAULT_CATS.find(c => c.id === FALLBACK[t])});
  if (!Array.isArray(o.conti) || !o.conti.length) o.conti = DEFAULT_CONTI.map(c => ({...c}));
  const c0 = o.conti[0].id;
  o.spese.forEach(x => {
    if (!['entrata','uscita','giro'].includes(x.tipo)) x.tipo = 'uscita';
    if (!x.conto) x.conto = c0;
  });
  if (!Array.isArray(o.scadenze)) o.scadenze = [];
  if (!Array.isArray(o.ricorrenti)) o.ricorrenti = [];
  if (!Array.isArray(o.obiettivi)) o.obiettivi = [];
  if (!Array.isArray(o.appunti)) o.appunti = [];
  for (const k of ['figli', 'figliMov', 'contatori', 'letture', 'dispensa']) if (!Array.isArray(o[k])) o[k] = [];
  if (!o.nascondi || typeof o.nascondi !== 'object') o.nascondi = {};
  if (!Array.isArray(o.profili) || !o.profili.length) o.profili = DEF_PROFILI.map(p => ({...p}));
  o.profiliOn = !!o.profiliOn; o.figliOn = !!o.figliOn;
  if (!o.cats.some(c => c.id === 'abbo')){ const i = o.cats.findIndex(c => c.id === 'altro'); o.cats.splice(i < 0 ? o.cats.length : i, 0, {id:'abbo', nome:'Abbonamenti', col:'#B0477A', tipo:'uscita'}); }
  o.tema = o.tema || 'auto';
  o.scadenze.forEach(x => { if (x.tipo !== 'promemoria') x.tipo = 'pagamento'; if (x.preavviso == null) x.preavviso = x.tipo === 'promemoria' ? 30 : 3; });
  for (const k of ['lastBackup','lastRemind','pin']) if (!(k in o)) o[k] = null;
  o.pinLen = o.pinLen || 0;
  o.v = 7; return o;
}

/* Movimenti automatici: registra quelli maturati fino a oggi */
function applyRecurring(){
  const t = today(), cur = t.slice(0, 7), added = [];
  for (const r of S.ricorrenti){
    if (!r.attivo) continue;
    let ym = r.ultimo ? shiftYM(r.ultimo, 1) : cur, guard = 0;
    while (r.attivo && ym <= cur && guard++ < 120){
      if (r.rate && (r.fatte || 0) >= r.rate){ r.attivo = false; break; }
      const [y,m] = ym.split('-').map(Number);
      const d = `${ym}-${pad(Math.min(r.giorno, new Date(y, m, 0).getDate()))}`;
      if (d > t) break;
      const mv = {id:uid(), tipo:r.tipo, data:d, importo:r.importo, cat:r.cat, conto:r.conto, descr:r.nome, ricId:r.id};
      if (r.prof) mv.prof = r.prof;
      if (r.esempio) mv.esempio = true;
      S.spese.push(mv); r.ultimo = ym; added.push(r.nome); ym = shiftYM(ym, 1);
      if (r.rate){ r.fatte = (r.fatte || 0) + 1; if (r.fatte >= r.rate) r.attivo = false; }
    }
  }
  if (S.figliOn) for (const f of S.figli){
    if (!(f.paghetta > 0)) continue;
    let ym = f.ultimo ? shiftYM(f.ultimo, 1) : cur, guard = 0;
    while (ym <= cur && guard++ < 60){
      const [y, m] = ym.split('-').map(Number);
      const d = `${ym}-${pad(Math.min(f.giorno || 1, new Date(y, m, 0).getDate()))}`;
      if (d > t) break;
      S.figliMov.push({id:uid(), figlio:f.id, data:d, tipo:'entrata', importo:f.paghetta, descr:'Paghetta', auto:true});
      if (f.conta) S.spese.push({id:uid(), tipo:'uscita', data:d, importo:f.paghetta, cat:S.cats.some(c => c.id === 'figli') ? 'figli' : 'altro', conto:(S.conti[0] || {}).id, descr:`Paghetta ${f.nome}`, ricId:'pag-' + f.id});
      f.ultimo = ym; added.push(`Paghetta ${f.nome}`); ym = shiftYM(ym, 1);
    }
  }
  if (added.length) save();
  return added;
}

function forecast(){
  const nd = new Date(), t = today(), cur = t.slice(0, 7), dim = new Date(nd.getFullYear(), nd.getMonth()+1, 0).getDate(), end = `${cur}-${pad(dim)}`;
  let inArr = 0, outFix = 0;
  for (const r of S.ricorrenti){
    if (!r.attivo || (r.ultimo && r.ultimo >= cur)) continue;
    const d = `${cur}-${pad(Math.min(r.giorno, dim))}`; if (d <= t) continue;
    if (r.tipo === 'entrata') inArr += r.importo; else outFix += r.importo;
  }
  for (const s of S.scadenze) if (s.tipo !== 'promemoria' && s.prossima <= end) outFix += s.importo;
  const fixedNames = new Set(S.scadenze.map(s => s.nome.toLowerCase()));
  let tot = 0, days = 0;
  for (let i = 1; i <= 3; i++){
    const ym = shiftYM(cur, -i), [yy, mm] = ym.split('-').map(Number);
    days += new Date(yy, mm, 0).getDate();
    tot += sum(S.spese.filter(x => x.tipo === 'uscita' && !x.ricId && !x.scadId && !fixedNames.has((x.descr || '').toLowerCase()) && x.data.startsWith(ym)));
  }
  const daysLeft = dim - nd.getDate();
  return {inArr, outFix, varEst: days ? tot / days * daysLeft : 0, daysLeft};
}
function forecastBlock(bal, totConti){
  const f = forecast(), delta = f.inArr - f.outFix - f.varEst, end = bal + delta;
  return `<section class="block"><div class="block-head"><h3>Previsione a fine mese</h3><span class="muted" style="font-size:12px">${f.daysLeft === 1 ? 'manca 1 giorno' : `mancano ${f.daysLeft} giorni`}</span></div>
  <div class="card frows">
    <div class="frow"><span>Saldo del mese oggi</span><span class="num">${sgn(bal)}</span></div>
    <div class="frow"><span>Entrate automatiche in arrivo</span><span class="num pos">+${eur.format(f.inArr)}</span></div>
    <div class="frow"><span>Scadenze e uscite fisse</span><span class="num">−${eur.format(f.outFix)}</span></div>
    <div class="frow"><span>Spese di tutti i giorni<br><small class="muted">stima sulla media degli ultimi 3 mesi</small></span><span class="num">−${eur.format(f.varEst)}</span></div>
    <div class="frow tot"><span>Saldo del mese previsto</span><b class="num ${end >= 0 ? 'pos' : 'neg'}">${sgn(end)}</b></div>
    <div class="frow"><span>Totale dei conti a fine mese</span><span class="num">circa ${eur.format(totConti + delta)}</span></div>
  </div></section>`;
}
function credits(){
  const m = new Map();
  for (const x of S.spese){
    if (!x.diviso || x.diviso.saldato) continue;
    const e = m.get(x.diviso.con) || {v:0, n:0};
    e.v += x.importo * (1 - x.diviso.quota); e.n++; m.set(x.diviso.con, e);
  }
  return [...m].map(([nome, e]) => ({nome, v:Math.round(e.v * 100) / 100, n:e.n})).filter(c => c.v > 0);
}
function monthsLeft(ym){ if (!ym) return 0; const [y,m] = ym.split('-').map(Number), nd = new Date(); return (y*12 + m) - (nd.getFullYear()*12 + nd.getMonth() + 1) + 1; }
function goalsBlock(){
  const g = S.obiettivi;
  const row = o => {
    const pct = Math.min(100, o.messo / o.target * 100), rest = Math.max(0, o.target - o.messo), ml = monthsLeft(o.entro), done = rest <= 0;
    const sub = done ? 'Obiettivo raggiunto' : !o.entro ? `Mancano ${eur.format(rest)}` : ml <= 0 ? `Data passata, mancano ${eur.format(rest)}` : `Metti da parte ${eur.format(rest / ml)} al mese fino a ${fmtYM(o.entro)}`;
    return `<div class="cat-row goal" data-goal="${o.id}" role="button" tabindex="0">
      <div class="nm"><span class="dot" style="background:${o.col}"></span><span>${esc(o.nome)}</span>${done ? '<span class="pill ok">Fatto</span>' : ''}</div>
      <span class="num">${eur0.format(o.messo)}<span class="lim"> / ${eur0.format(o.target)}</span></span>
      <div class="bar"><span style="width:${pct}%;background:${o.col}"></span></div>
      <span class="lim" style="grid-column:1/-1">${sub}</span>
      ${done ? '' : `<button class="paybtn" data-gadd="${o.id}" style="grid-column:1/-1;justify-self:start">+ Metti da parte</button>`}</div>`;
  };
  return `<section class="block"><div class="block-head"><h3>Obiettivi di risparmio</h3><button class="linkbtn" data-act="newGoal">+ Nuovo</button></div>
    ${g.length ? `<div class="cats">${g.map(row).join('')}</div>` : `<div class="empty">Dai un nome a quello per cui risparmi, ad esempio le vacanze, e ti dico quanto mettere da parte ogni mese.</div>`}</section>`;
}

function render(){
  const v = $('#view');
  const full = S, pv = ['home','spese','cal','scad'].includes(V.tab) ? profView() : null;
  if (pv) S = pv;
  try { v.innerHTML = profBar() + ({home:renderHome, spese:renderMov, cal:renderCal, scad:renderScad, note:renderNote, impo:renderImpo}[V.tab] || renderHome)(); }
  finally { S = full; }
  for (const id of ['cmpA', 'cmpB']){ const el = document.getElementById(id); if (el) el.addEventListener('change', e => { V[id] = e.target.value; render(); }); }
  $('#setBtn').setAttribute('aria-pressed', String(V.tab === 'impo'));
  document.querySelectorAll('.tab').forEach(t => { if (t.dataset.tab === V.tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  for (const [idq, key] of [['q', 'q'], ['nq', 'nq']]){
    const el = document.getElementById(idq);
    if (el) el.addEventListener('input', e => { V[key] = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById(idq); n.focus(); try { n.setSelectionRange(pos, pos); } catch(_){} });
  }
}
function goTab(t){ V.tab = t; try { localStorage.setItem(KEY+'-tab', t); } catch(_){} render(); window.scrollTo(0, 0); }

/* ---------- sheet e toast ---------- */
let sheetEl = null;
function openSheet(html, mount){
  closeSheet();
  sheetEl = document.createElement('div');
  sheetEl.className = 'scrim';
  sheetEl.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  sheetEl.addEventListener('click', e => { if (e.target === sheetEl || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(sheetEl);
  mount && mount(sheetEl);
  const f = sheetEl.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet(){ if (sheetEl){ sheetEl.remove(); sheetEl = null; } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

let toastT, undoSnap = null;
function toast(msg){ const t = $('#toast'); $('#toast-t').textContent = msg; $('#toast-u').hidden = true; undoSnap = null; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
const snapshot = () => JSON.stringify(S);
let undoHook = null;
function offerUndo(snap, hook){
  undoHook = hook || null; undoSnap = snap; $('#toast-u').hidden = false; $('#toast').hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { $('#toast').hidden = true; undoSnap = null; }, 6000);
}
$('#toast-u').addEventListener('click', () => { if (!undoSnap) return; S = JSON.parse(undoSnap); undoSnap = null; if (undoHook){ try { undoHook(); } catch(_){} undoHook = null; } save(); applyTheme(); closeSheet(); render(); toast('Ripristinato'); });

function twoTap(btn, label, fn){
  let armed = false;
  btn.addEventListener('click', () => {
    if (!armed){ armed = true; const o = btn.textContent; btn.textContent = label; setTimeout(() => { armed = false; if (btn.isConnected) btn.textContent = o; }, 3500); return; }
    const snap = snapshot(); fn(); offerUndo(snap);
  });
}
function wireSwatches(root, cb){ wireChips(root, 'col', cb); }

/* ---------- inserimento veloce ---------- */
function recentFor(tipo){
  const seen = new Set(), out = [];
  for (const m of [...S.spese].sort((a,b) => b.data.localeCompare(a.data))){
    if (m.tipo !== tipo || !m.descr) continue;
    const k = m.descr.toLowerCase(); if (seen.has(k)) continue;
    seen.add(k); out.push(m); if (out.length >= 6) break;
  }
  return out;
}
function namesFor(tipo){
  const set = new Map();
  for (const m of [...S.spese].sort((a,b) => b.data.localeCompare(a.data))) if (m.tipo === tipo && m.descr && !set.has(m.descr.toLowerCase())) set.set(m.descr.toLowerCase(), m.descr);
  for (const s of S.scadenze) if (tipo === 'uscita' && !set.has(s.nome.toLowerCase())) set.set(s.nome.toLowerCase(), s.nome);
  return [...set.values()].slice(0, 60);
}
function lastByName(tipo, name){
  const k = name.trim().toLowerCase(); if (!k) return null;
  return [...S.spese].sort((a,b) => b.data.localeCompare(a.data)).find(m => m.tipo === tipo && (m.descr || '').toLowerCase() === k) || null;
}

        <div class="settings">
          <div class="field"><label for="f-tag">Tag</label><input id="f-tag" placeholder="Es. vacanze2026, casa-nuova" value="${esc((s?.tags || []).join(', '))}" autocomplete="off">

          <div class="field"><label for="f-note">Note</label><textarea id="f-note" class="plain" placeholder="Es. numero fattura, garanzia fino a…">${esc(s?.note || '')}</textarea></div>
          <div class="field"><label>Foto dello scontrino</label>
            <div id="f-foto"></div>
            <label class="btn ghost" for="f-file" style="text-align:center">Scatta o scegli una foto</label>
            <input id="f-file" type="file" accept="image/*" capture="environment" hidden>
            <small class="muted">La foto resta solo su questo telefono e non entra nel backup.</small></div>
          <div id="f-usc" class="settings">
            <label class="check"><input type="checkbox" id="f-gar" ${s?.garanzia ? 'checked' : ''}><span>In garanzia<br><span class="muted" style="font-size:13px">Ti avviso un mese prima che scada.</span></span></label>
            <div class="field" id="f-garbox" ${s?.garanzia ? '' : 'hidden'}><label for="f-garm">Durata della garanzia</label><select id="f-garm">${[12, 24, 36, 60].map(m => `<option value="${m}" ${(s?.garanzia || 24) === m ? 'selected' : ''}>${m === 12 ? '1 anno' : `${m / 12} anni`}</option>`).join('')}</select></div>
            <label class="check"><input type="checkbox" id="f-det" ${s?.detraibile ? 'checked' : ''}><span>Detraibile nel 730</span></label>
            <label class="check"><input type="checkbox" id="f-div" ${s?.diviso ? 'checked' : ''}><span>Spesa divisa<br><span class="muted" style="font-size:13px">L'ho pagata io e un'altra persona mi deve la sua parte.</span></span></label>

              <div class="field"><label for="f-quo">La mia parte</label><select id="f-quo">${quotas.map(([v,l]) => `<option value="${v}" ${s?.diviso && Math.abs(s.diviso.quota - v) < .001 ? 'selected' : ''}>${l}</option>`).join('')}</select></div>

      </details>
      ${s ? '' : `<label class="check" id="f-rep-w"><input type="checkbox" id="f-rep"><span>Ripeti ogni mese in automatico<br><span class="muted" style="font-size:13px">Lo registro da solo ogni mese nello stesso giorno.</span></span></label>`}
      ${s?.ricId ? '<p style="font-size:13px">Registrato in automatico. Le modifiche valgono solo per questo mese.</p>' : ''}
      <div class="err" id="f-err"></div>
      <button class="btn wide" type="submit">${s ? 'Salva modifiche' : 'Aggiungi'}</button>
      ${s ? '<button class="btn danger wide" type="button" id="f-del">Elimina</button>' : ''}
      <button class="btn ghost wide" type="button" data-close>Annulla</button>
    </form>`, root => {

      if (foto){ $r('#f-th').addEventListener('click', () => viewImage(foto)); $r('#f-frm').addEventListener('click', () => { foto = null; fotoChanged = true; drawFoto(); }); }

function parseTags(v){ return [...new Set(String(v).split(/[,\s]+/).map(t => t.replace(/^#+/, '').trim().toLowerCase()).filter(Boolean))]; }
function topTags(){
  const c = new Map();
  for (const x of S.spese) for (const t of x.tags || []) c.set(t, (c.get(t) || 0) + 1);
  return [...c].sort((a,b) => b[1] - a[1]).slice(0, 8).map(x => x[0]);

function viewImage(src){
  const el = document.createElement('div'); el.id = 'viewer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Foto, tocca per chiudere');
  el.innerHTML = `<img src="${src}" alt="Foto dello scontrino">`;
  el.addEventListener('click', () => el.remove());
  document.body.appendChild(el);
}
function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
let dbP = null;
function idb(){
  return dbP ||= new Promise((res, rej) => {
    try { const r = indexedDB.open('gelu-inc-bilancino-foto', 1); r.onupgradeneeded = () => r.result.createObjectStore('foto'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
}
async function fotoGet(id){
  try { const db = await idb(); return await new Promise(res => { const q = db.transaction('foto').objectStore('foto').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }
  catch(e){ return null; }
}
async function fotoPut(id, data){
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('foto', 'readwrite'); tx.objectStore('foto').put(data, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function fotoDel(id){ try { const db = await idb(); db.transaction('foto', 'readwrite').objectStore('foto').delete(id); } catch(e){} }
async function fotoClear(){ try { const db = await idb(); db.transaction('foto', 'readwrite').objectStore('foto').clear(); } catch(e){} }

function storico(s){
  const k = s.nome.toLowerCase();
  return S.spese.filter(x => x.tipo === 'uscita' && (x.scadId === s.id || (x.descr || '').toLowerCase() === k)).sort((a,b) => a.data.localeCompare(b.data));
}
function historyHTML(s){
  const h = storico(s);
  if (!h.length) return `<div class="field"><label>Storico pagamenti</label><p style="font-size:13px;margin:0">Nessun pagamento registrato finora.</p></div>`;
  const t = new Date(), a = new Date(t), b = new Date(t);
  a.setFullYear(t.getFullYear() - 1); b.setFullYear(t.getFullYear() - 2);
  const last = sum(h.filter(x => parse(x.data) > a)), prev = sum(h.filter(x => parse(x.data) > b && parse(x.data) <= a));
  let cmp = 'Non ho ancora i dati dell\'anno prima per il confronto.';
  if (prev > 0){ const d = (last - prev) / prev * 100; cmp = Math.round(d) === 0 ? `Stessa spesa dei 12 mesi prima (${eur.format(prev)}).` : `<span class="${d > 0 ? 'delta-up' : 'delta-down'}">${d > 0 ? '+' : ''}${d.toFixed(0)}%</span> rispetto ai 12 mesi prima (${eur.format(prev)}).`; }
  const lastN = h.slice(-12), mx = Math.max(...lastN.map(x => x.importo));
  return `<div class="field"><label>Storico pagamenti</label>
    <div class="hist">${lastN.map(x => `<div class="hcol" title="${fmtLong(x.data)}: ${eur.format(x.importo)}"><span class="hb" style="height:${Math.max(3, x.importo / mx * 66)}px"></span><span class="hl">${parse(x.data).toLocaleDateString('it-IT', {month:'short'}).replace('.', '')}</span></div>`).join('')}</div>
    <p style="font-size:13px;margin:0">Ultimi 12 mesi: <b class="num">${eur.format(last)}</b>. ${cmp}<br>Media per pagamento <span class="num">${eur.format(sum(h) / h.length)}</span>, ultimo <span class="num">${eur.format(h[h.length - 1].importo)}</span>.</p></div>`;
}

function wireFile(root, getName, getText, mime, onSaved){
  root.querySelector('#x-dl').addEventListener('click', () => {
    try {
      const blob = new Blob([getText(true)], {type:mime});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = getName(); document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      onSaved && onSaved();
      toast('Download avviato. Se non parte, usa Copia testo.');
    } catch(e){ toast('Download non disponibile qui. Usa Copia testo.'); }
  });
  const sh = root.querySelector('#x-sh');
  if (sh){
    sh.hidden = !(navigator.canShare && window.File);
    sh.addEventListener('click', async () => {
      try {
        let f = new File([getText(true)], getName(), {type:mime});
        if (!navigator.canShare({files:[f]})) f = new File([getText(true)], getName().replace(/\.\w+$/, '.txt'), {type:'text/plain'});
        if (!navigator.canShare({files:[f]})) throw new Error('no');
        await navigator.share({files:[f], title:getName()});
        onSaved && onSaved(); toast('Condiviso');
      } catch(e){ if (e && e.name === 'AbortError') return; toast('Condivisione non disponibile qui. Usa Scarica o Copia.'); }
    });
  }
  root.querySelector('#x-cp').addEventListener('click', () => {
    const ta = root.querySelector('#x-ta');
    const fallback = () => { ta.focus(); ta.select(); toast('Testo selezionato: copialo dal menu'); };
    try { navigator.clipboard.writeText(getText(false)).then(() => { onSaved && onSaved(); toast('Copiato'); }, fallback); } catch(e){ fallback(); }
  });
}

function csvText(list){
  const rows = [['Data','Tipo','Nome','Categoria','Conto','Importo','Tag','Note','Detraibile 730','Diviso con']];
  [...list].sort((a,b) => a.data.localeCompare(b.data)).forEach(m => rows.push([
    m.data.split('-').reverse().join('/'), TIPO_L[m.tipo], m.descr || '', m.tipo === 'giro' ? '' : catOf(m.cat).nome,
    m.tipo === 'giro' ? `${contoOf(m.conto).nome} -> ${contoOf(m.contoA).nome}` : contoOf(m.conto).nome,

/* ---------- PIN ---------- */
async function hashPin(p){
  const str = 'bilancino:' + p;
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch(e){ let h = 5381; for (const ch of str) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'f' + (h >>> 0).toString(16); }
}
function pinSheet(){

      <div class="field"><label for="p-2">Ripeti il PIN</label><input id="p-2" class="num" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>

function showLock(){
  try { if (IN_HOME && window.parent.__GELU_HOME__.pinOn) return; } catch(_){}
  if (!S.pin || locked) return;
  locked = true; closeSheet();
  const el = document.createElement('div'); el.id = 'lock';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  el.innerHTML = `<img src="icon-192.png" alt="" style="width:56px;height:56px;border-radius:14px">
    <h2>Inserisci il PIN</h2><div class="pindots">${'<i></i>'.repeat(S.pinLen)}</div><p class="msg" id="lk-msg"></p>
    <div class="keypad">${keys.map(k => k ? `<button type="button" data-k="${k}" aria-label="${k === '⌫' ? 'Cancella' : k}">${k}</button>` : '<span class="blank"></span>').join('')}</div>`;
  document.body.appendChild(el);
  let v = '', busy = false;
  const dots = () => el.querySelectorAll('.pindots i').forEach((d, i) => d.classList.toggle('on', i < v.length));
  const press = async k => {
    if (busy) return;
    if (k === '⌫'){ v = v.slice(0, -1); dots(); return; }
    if (v.length >= S.pinLen) return;
    v += k; dots(); el.querySelector('#lk-msg').textContent = '';
    if (v.length === S.pinLen){
      busy = true;
      const ok = (await hashPin(v)) === S.pin;
      if (ok){ el.remove(); locked = false; document.removeEventListener('keydown', kb); afterUnlock(); }
      else { const pd = el.querySelector('.pindots'); pd.classList.remove('shake'); void pd.offsetWidth; pd.classList.add('shake'); el.querySelector('#lk-msg').textContent = 'PIN errato, riprova.'; v = ''; setTimeout(dots, 300); }
      busy = false;
    }
  };
  el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  const kb = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); };
  document.addEventListener('keydown', kb);
}

const INBOX = 'gelu-inc-bilancino-inbox';
/* ---------- la dispensa si è spostata in Spesa ---------- */
function moveDispensa(){
  if (!Array.isArray(S.dispensa) || !S.dispensa.length) return 0;
  const real = S.dispensa.filter(d => !d.esempio);
  if (!real.length){ S.dispensa = []; save(); return 0; }
  if (!carrelloOn()) return 0;
  try {
    const a = JSON.parse(localStorage.getItem(CARR_INBOX) || '[]');
    for (const d of real) a.push({id:'bil-disp-' + d.id, tipo:'dispensa', nome:d.nome, dove:d.dove, qta:d.qta || '', scade:d.scade || null, app:'Soldi'});
    localStorage.setItem(CARR_INBOX, JSON.stringify(a));
  } catch(_){ return 0; }
  S.dispensa = []; save();
  setTimeout(() => toast(`Dispensa spostata in Spesa: ${real.length} ${real.length === 1 ? 'prodotto' : 'prodotti'}`), 600);
  return real.length;
}
function dispMovedNote(){
  const n = (S.dispensa || []).filter(d => !d.esempio).length;
  if (!n) return '';
  return `<div class="note" style="background:var(--warn-soft)"><span>La dispensa ora è nell'app <b>Spesa</b>. Appena la installi su questo telefono, i tuoi ${n} prodotti passano lì da soli.</span></div>`;
}

function readInbox(){
  let a = [];
  try { a = JSON.parse(localStorage.getItem(INBOX) || '[]'); } catch(_){ return 0; }
  if (!Array.isArray(a) || !a.length) return 0;
  let n = 0, app = '';
  for (const x of a){
    if (!x || !(x.importo > 0) || !x.data || S.spese.some(s => s.extId === x.id)) continue;
    const m = {id:uid(), extId:x.id, tipo:'uscita', data:x.data, importo:Math.round(x.importo * 100) / 100, cat:S.cats.some(c => c.id === x.cat && c.tipo === 'uscita') ? x.cat : firstCat('uscita', 'spesa'), conto:(S.conti[0] || {}).id, descr:x.descr || 'Spesa'};
    if (x.note) m.note = x.note;
    S.spese.push(m); n++; app = x.app || app;
  }
  try { localStorage.removeItem(INBOX); } catch(_){}
  if (n){ save(); setTimeout(() => toast(`${n === 1 ? 'Arrivata 1 spesa' : `Arrivate ${n} spese`}${app ? ` da ${app}` : ''}`), 400); }
  return n;
}

/* ---------- controllo dei dati ---------- */
function checkSheet(){
  const groups = new Map();
  for (const x of S.spese){
    if (x.tipo === 'giro') continue;
    const k = [x.tipo, x.data, x.importo, (x.descr || '').toLowerCase().trim()].join('|');
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(x);
  }
  const dups = [...groups.values()].filter(g => g.length > 1);
  const byCat = {};
  for (const x of usc(S.spese)) (byCat[x.cat] ||= []).push(x.importo);
  const med = a => { const q = [...a].sort((p, r) => p - r); return q[Math.floor(q.length / 2)]; };
  const odd = usc(S.spese).filter(x => { const a = byCat[x.cat]; return a.length >= 5 && x.importo > 100 && x.importo > med(a) * 5; }).sort((a,b) => b.importo - a.importo).slice(0, 10);
  const noCat = S.spese.filter(x => x.tipo !== 'giro' && !S.cats.some(c => c.id === x.cat));
  const noConto = S.spese.filter(x => !S.conti.some(c => c.id === x.conto) || (x.tipo === 'giro' && !S.conti.some(c => c.id === x.contoA)));
  const fut = S.spese.filter(x => !x.ricId && daysUntil(x.data) > 31);
  const meters = S.contatori.filter(c => { const l = lettureDi(c.id); return l.some((r, i) => i && r.valore < l[i - 1].valore); });
  const n = dups.length + odd.length + noCat.length + noConto.length + fut.length + meters.length;
  const list = arr => `<div class="list">${arr.map(movItemD).join('')}</div>`;
  openSheet(`<h2>Controllo dei dati</h2>
    ${!n ? '<div class="empty">Tutto in ordine: nessun problema trovato.</div>' : `<p>Ho trovato ${n} ${n === 1 ? 'cosa da controllare' : 'cose da controllare'}. Tocca una voce per aprirla.</p>`}
    ${dups.length ? `<div class="sub">Possibili doppioni · ${dups.length}</div>${dups.map(g => list(g)).join('')}<button class="btn ghost wide" id="ck-dup">Elimina i doppioni (tengo il primo di ogni gruppo)</button>` : ''}
    ${odd.length ? `<div class="sub">Importi molto più alti del solito</div><p style="font-size:13px;margin:0">Più di 5 volte la spesa tipica della loro categoria. Se sono giusti, ignora pure.</p>${list(odd)}` : ''}
    ${noCat.length ? `<div class="sub">Senza categoria · ${noCat.length}</div>${list(noCat.slice(0, 10))}<button class="btn ghost wide" id="ck-cat">Sposta in «Altro»</button>` : ''}
    ${noConto.length ? `<div class="sub">Con un conto che non esiste più · ${noConto.length}</div>${list(noConto.slice(0, 10))}<button class="btn ghost wide" id="ck-conto">Sposta su «${esc(S.conti[0]?.nome || '')}»</button>` : ''}
    ${fut.length ? `<div class="sub">Con una data lontana nel futuro</div><p style="font-size:13px;margin:0">Forse l'anno è sbagliato.</p>${list(fut.slice(0, 10))}` : ''}
    ${meters.length ? `<div class="sub">Contatori con letture che scendono</div><div class="list">${meters.map(meterRow).join('')}</div>` : ''}
    <button class="btn ghost wide" data-close>Chiudi</button>`, root => {
    root.addEventListener('click', sheetNav);
    const fix = (id, fn, msg) => { const b = root.querySelector(id); if (b) b.addEventListener('click', e => { e.stopPropagation(); const snap = snapshot(); fn(); save(); render(); checkSheet(); toast(msg); offerUndo(snap); }); };
    fix('#ck-dup', () => { const rm = new Set(dups.flatMap(g => g.slice(1).map(x => x.id))); S.spese = S.spese.filter(x => !rm.has(x.id)); }, 'Doppioni eliminati');
    fix('#ck-cat', () => noCat.forEach(x => x.cat = FALLBACK[x.tipo] || 'altro'), 'Spostati in «Altro»');
    fix('#ck-conto', () => noConto.forEach(x => { if (!S.conti.some(c => c.id === x.conto)) x.conto = S.conti[0].id; if (x.tipo === 'giro' && !S.conti.some(c => c.id === x.contoA)) x.contoA = (S.conti.find(c => c.id !== x.conto) || S.conti[0]).id; }), 'Conti sistemati');
  });
}

function applyWizard(w){
  const snap = snapshot();
  const P = v => { const n = parseAmount(v); return isNaN(n) ? 0 : n; };

  S.obiettivi = S.obiettivi.filter(x => !x.esempio); S.appunti = S.appunti.filter(x => !x.esempio); S.contatori = S.contatori.filter(x => !x.esempio);
  S.letture = S.letture.filter(x => !x.esempio); S.dispensa = S.dispensa.filter(x => !x.esempio);
  for (const c of S.cats) if ((c.id === 'spesa' && c.budget === 300) || (c.id === 'svago' && c.budget === 60)) delete c.budget;
  const used = id => S.spese.some(x => x.conto === id || x.contoA === id) || S.ricorrenti.some(x => x.conto === id);
  for (const k of ['conto', 'carta', 'contanti']){
    const want = w.conti[k], ex = S.conti.find(c => c.id === k);
    if (want.on){ if (ex) ex.saldoIniziale = P(want.v); else S.conti.push({...DEFAULT_CONTI.find(c => c.id === k), saldoIniziale:P(want.v)}); }
    else if (ex && !used(k) && S.conti.length > 1) S.conti = S.conti.filter(c => c !== ex);
  }
  const main = (S.conti.find(c => c.id === 'conto') || S.conti[0]).id;
  const cur = today().slice(0, 7), dNow = new Date().getDate();
  const firstYM = g => g <= dNow ? cur : shiftYM(cur, -1);
  const st = P(w.stip.v), sg = Math.min(31, Math.max(1, parseInt(w.stip.g, 10) || 27));
  if (st > 0) S.ricorrenti.push({id:uid(), tipo:'entrata', nome:'Stipendio', cat:firstCat('entrata', 'stip'), conto:main, importo:st, giorno:sg, ultimo:firstYM(sg), attivo:true});
  const in30 = (() => { const t = new Date(); t.setDate(t.getDate() + 30); return iso(t); })();
  for (const b of w.bills){

    <span class="pill ${st.c}">${st.t}</span></div>`;

/* ---------- contatori ---------- */
const lettureDi = id => S.letture.filter(l => l.cont === id).sort((a,b) => a.data.localeCompare(b.data));
function consumi(id){
  const l = lettureDi(id), out = [];
  for (let i = 1; i < l.length; i++){
    const g = Math.max(1, Math.round((parse(l[i].data) - parse(l[i-1].data)) / 864e5));
    out.push({da:l[i-1].data, a:l[i].data, q:Math.round((l[i].valore - l[i-1].valore) * 100) / 100, giorni:g});
  }
  return out;
}
function costoUnit(c){
  if (!c.scad) return null;
  const sc = S.scadenze.find(x => x.id === c.scad); if (!sc) return null;
  const l = lettureDi(c.id); if (l.length < 2) return null;
  const lim = new Date(); lim.setFullYear(lim.getFullYear() - 1);
  const start = l.filter(x => x.data <= iso(lim)).pop() || l[0], end = l[l.length - 1], q = end.valore - start.valore;
  if (q <= 0) return null;
  const pay = sum(storico(sc).filter(x => x.data > start.data && x.data <= end.data));
  return pay ? {eur:pay / q, pay, q, da:start.data, a:end.data} : null;
}
function meterRow(c){
  const l = lettureDi(c.id), cs = consumi(c.id), last = l[l.length - 1], lp = cs[cs.length - 1];
  const late = !last || -daysUntil(last.data) > 35;
  return `<button class="item" data-meter="${c.id}"><span class="dot" style="background:${c.col}"></span>

/* ---------- torta ---------- */
function donutHTML(outs, tot){
  const rows = cats('uscita').map(c => ({c, v:sum(outs.filter(x => x.cat === c.id))})).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  if (!rows.length || !tot) return '';
  const R = 58, C = 2 * Math.PI * R, sel = rows.find(x => x.c.id === V.dsel);
  let acc = 0;
  const segs = rows.map(x => {
    const len = x.v / tot * C, gap = rows.length > 1 ? Math.min(2, len * 0.3) : 0, on = sel && sel.c.id === x.c.id;
    const out = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${x.c.col}" stroke-width="${on ? 26 : 20}" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)" data-dcat="${x.c.id}" style="cursor:pointer;opacity:${sel && !on ? .35 : 1}"><title>${esc(x.c.nome)}: ${eur.format(x.v)}</title></circle>`;
    acc += len; return out;
  }).join('');
  const nm = sel ? (sel.c.nome.length > 15 ? sel.c.nome.slice(0, 14) + '…' : sel.c.nome) : 'Uscite';
  const center = `<text x="80" y="${sel ? 70 : 74}" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${esc(nm)}</text>
    <text x="80" y="${sel ? 90 : 94}" text-anchor="middle" style="font-size:16px;font-weight:600;fill:var(--ink);font-family:var(--f-num)">${eur0.format(sel ? sel.v : tot)}</text>
    ${sel ? `<text x="80" y="107" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${(sel.v / tot * 100).toFixed(0)}%</text>` : ''}`;
  return `<div class="donut"><svg viewBox="0 0 160 160" role="img" aria-label="Uscite per categoria">${segs}${center}</svg>
    <div class="dleg">${rows.slice(0, 8).map(x => `<button type="button" class="dl${sel && sel.c.id === x.c.id ? ' on' : ''}" data-dcat="${x.c.id}"><span class="dot" style="background:${x.c.col}"></span><span>${esc(x.c.nome)}</span><span class="num">${(x.v / tot * 100).toFixed(0)}%</span></button>`).join('')}
    ${sel ? `<button type="button" class="linkbtn" data-act="dGo" style="text-align:left;padding:4px 6px">Vedi i movimenti</button>` : '<span class="lim" style="padding:4px 6px">Tocca una fetta</span>'}</div></div>`;
}

/* ---------- confronto ---------- */
function renderCompare(){
  const mode = V.cmpMode, cur = today().slice(0, 7);
  let opts;
  if (mode === 'mesi'){ opts = []; for (let i = 0; i < 24; i++){ const ym = shiftYM(cur, -i); opts.push([ym, fmtYM(ym)]); } }
  else { const ys = new Set(S.spese.map(x => x.data.slice(0, 4))); ys.add(cur.slice(0, 4)); opts = [...ys].sort().reverse().map(y => [y, y]); }
  let A = V.cmpA, B = V.cmpB;
  if (!opts.some(o => o[0] === A)) A = opts[0][0];
  if (!opts.some(o => o[0] === B) || (B === A && opts.length > 1)) B = (opts.find(o => o[0] !== A) || opts[0])[0];
  V.cmpA = A; V.cmpB = B;
  const sel = (id, v) => `<select id="${id}">${opts.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const get = k => S.spese.filter(x => x.data.startsWith(mode === 'mesi' ? k : k + '-'));
  const a = get(A), b = get(B);
  const pct = (va, vb, goodUp) => {
    if (!vb) return {t:va ? 'nuovo' : '–', c:''};
    const d = (va - vb) / vb * 100;
    if (Math.round(d) === 0) return {t:'=', c:''};
    return {t:`${d > 0 ? '+' : ''}${d.toFixed(0)}%`, c:(d > 0) === goodUp ? 'delta-down' : 'delta-up'};
  };
  const row = (n, va, vb, goodUp) => { const p = pct(va, vb, goodUp); return `<div class="cmprow"><span>${n}</span><span class="num">${eur0.format(va)}</span><span class="num muted">${eur0.format(vb)}</span><span class="num ${p.c}">${p.t}</span></div>`; };
  const sa = net(a), sb = net(b);
  const cs = cats('uscita').map(c => ({c, va:sum(usc(a).filter(x => x.cat === c.id)), vb:sum(usc(b).filter(x => x.cat === c.id))})).filter(x => x.va || x.vb).sort((p, q) => Math.max(q.va, q.vb) - Math.max(p.va, p.vb));
  const mx = Math.max(1, ...cs.map(x => Math.max(x.va, x.vb)));
  return `${sampleNote()}${periodSeg()}
  <div class="seg small" role="group" aria-label="Confronta"><button data-cmode="mesi" aria-pressed="${mode === 'mesi'}">Due mesi</button><button data-cmode="anni" aria-pressed="${mode === 'anni'}">Due anni</button></div>
  <div class="grid2">
    <div class="field"><label for="cmpA"><i class="lg a"></i>Periodo A</label>${sel('cmpA', A)}</div>
    <div class="field"><label for="cmpB"><i class="lg b"></i>Periodo B</label>${sel('cmpB', B)}</div>
  </div>
  <div class="card frows">
    <div class="cmprow head"><span></span><span>A</span><span>B</span><span>A su B</span></div>
    ${row('Entrate', sum(ent(a)), sum(ent(b)), true)}
    ${row('Uscite', sum(usc(a)), sum(usc(b)), false)}
    <div class="cmprow"><span><b>Saldo</b></span><span class="num ${sa >= 0 ? 'pos' : 'neg'}">${sa < 0 ? '−' : ''}${eur0.format(Math.abs(sa))}</span><span class="num muted">${sb < 0 ? '−' : ''}${eur0.format(Math.abs(sb))}</span><span class="num ${sa >= sb ? 'delta-down' : 'delta-up'}">${sa - sb >= 0 ? '+' : '−'}${eur0.format(Math.abs(sa - sb))}</span></div>
  </div>
  <section class="block">
    <div class="block-head"><h3>Uscite per categoria</h3></div>
    ${cs.length ? `<div class="cats">${cs.map(x => { const p = pct(x.va, x.vb, false); return `<div class="cat-row">
      <div class="nm"><span class="dot" style="background:${x.c.col}"></span><span>${esc(x.c.nome)}</span></div>
      <span class="num ${p.c}">${p.t}</span>
      <div class="bar"><span style="width:${x.va / mx * 100}%;background:var(--accent)"></span></div>
      <div class="bar"><span style="width:${x.vb / mx * 100}%;background:var(--gold)"></span></div>
      <span class="lim" style="grid-column:1/-1">A ${eur.format(x.va)} · B ${eur.format(x.vb)}</span></div>`; }).join('')}</div>` : '<div class="empty">Nessuna uscita in questi due periodi.</div>'}
  </section>`;
}

/* ---------- consigli ---------- */
const TIP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>';
function insights(){
  const out = [], cur = today().slice(0, 7);
  for (const c of cats('uscita')){
    const now = sum(S.spese.filter(x => x.tipo === 'uscita' && x.cat === c.id && x.data.startsWith(cur)));
    let tot = 0; for (let i = 1; i <= 3; i++){ const ym = shiftYM(cur, -i); tot += sum(S.spese.filter(x => x.tipo === 'uscita' && x.cat === c.id && x.data.startsWith(ym))); }
    const avg = tot / 3;
    if (avg >= 30 && now > avg * 1.2) out.push({w:now / avg, t:`<b>${esc(c.nome)}</b>: ${eur.format(now)} questo mese, il ${Math.round((now / avg - 1) * 100)}% sopra la tua media di ${eur.format(avg)}.`});
  }
  const ab = S.scadenze.filter(s => s.tipo === 'abbonamento' && s.freq > 0);
  if (ab.length >= 2){ const m = ab.reduce((t, s) => t + s.importo / s.freq, 0); out.push({w:1.15, t:`Hai <b>${ab.length} abbonamenti</b> per ${eur.format(m)} al mese, cioè ${eur.format(m * 12)} all'anno. Li usi tutti?`}); }
  const t = new Date(), a = new Date(t), b = new Date(t); a.setFullYear(t.getFullYear() - 1); b.setFullYear(t.getFullYear() - 2);
  for (const s of S.scadenze.filter(s => s.tipo === 'pagamento')){
    const h = storico(s), last = sum(h.filter(x => parse(x.data) > a)), prev = sum(h.filter(x => parse(x.data) > b && parse(x.data) <= a));
    if (prev > 0 && last > prev * 1.1) out.push({w:1 + (last - prev) / prev, t:`<b>${esc(s.nome)}</b>: +${Math.round((last / prev - 1) * 100)}% rispetto all'anno prima. Forse conviene confrontare le offerte.`});
  }
  const g = garanzieIn(30);
  if (g.length) out.push({w:1.6, t:`La garanzia di <b>${esc(g[0].descr || 'un acquisto')}</b> scade il ${fmtLong(garScad(g[0]))}. Se qualcosa non va, fallo presente prima.`});
  const due = S.scadenze.filter(s => s.tipo !== 'promemoria' && daysUntil(s.prossima) < 0);
  if (due.length) out.push({w:1.8, t:`${due.length === 1 ? `<b>${esc(due[0].nome)}</b> è scaduta` : `<b>${due.length} scadenze</b> sono passate`} e non risultano pagate.`});
  return out.sort((x, y) => y.w - x.w).slice(0, 4);
}
function insightsBlock(){
  const l = insights(); if (!l.length) return '';
  return `<section class="block"><div class="block-head"><h3>Consigli</h3></div><div class="card frows">${l.map(i => `<div class="frow tip">${TIP_ICON}<span style="flex:1">${i.t}</span></div>`).join('')}</div></section>`;
}

/* ---------- scorciatoie ---------- */
function handleAzione(){
  let a = null;
  try { a = new URLSearchParams(location.search).get('azione'); } catch(_){}
  if (!a) return false;
  try { history.replaceState(null, '', location.pathname); } catch(_){}
  if (a === 'spesa') formMov(null, 'uscita');
  else if (a === 'entrata') formMov(null, 'entrata');
  else if (a === 'nota'){ goTab('note'); formNota(null, 'testo'); }

  else return false;
  return true;
}

/* ---------- note ---------- */
const noteSort = (a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (b.agg || '').localeCompare(a.agg || '');
function notesDue(days){ if (IN_HOME) return []; const t = new Date(); t.setDate(t.getDate() + days); const lim = iso(t); return S.appunti.filter(n => n.data && n.data <= lim).sort((a,b) => a.data.localeCompare(b.data)); }
function noteItem(n, withDone){
  const d = daysUntil(n.data), st = d < 0 ? {c:'bad', t:`Da ${-d} gg`} : d === 0 ? {c:'warn', t:'Oggi'} : {c:'warn', t:d === 1 ? 'Domani' : `Tra ${d} gg`};
  return `<div class="item" data-nota="${n.id}" role="button" tabindex="0"><span class="dot" style="background:${n.col}"></span>

function noteDone(id){ const n = S.appunti.find(x => x.id === id); if (!n) return; n.data = null; delete n.esempio; save(); closeSheet(); render(); toast('Promemoria della nota tolto'); }
function noteCard(n){
  const t = daysUntil(n.data || '2999-01-01');
  const pill = n.data ? `<span class="pill ${t < 0 ? 'bad' : t <= 3 ? 'warn' : 'ok'}">${t > 300 ? fmtLong(n.data) : fmtShort(n.data)}</span>` : '<span></span>';
  let body;
  if (n.tipo === 'lista'){
    const todo = n.items.map((it, i) => ({it, i})).sort((a,b) => (a.it.ok ? 1 : 0) - (b.it.ok ? 1 : 0));
    const shown = todo.slice(0, 7), more = n.items.length - shown.length, done = n.items.filter(x => x.ok).length;
    body = `<div class="nitems">${shown.map(({it, i}) => `<button type="button" class="nit${it.ok ? ' ok' : ''}" data-ntog="${n.id}:${i}" aria-pressed="${it.ok}"><span class="box">${it.ok ? CHECK : ''}</span><span>${esc(it.t)}</span></button>`).join('')}
      ${more > 0 ? `<span class="nmore">+ altre ${more}</span>` : ''}${!n.items.length ? '<span class="nmore">Lista vuota</span>' : ''}</div>
      ${n.items.length ? `<span class="nmore num">${done}/${n.items.length} fatte</span>` : ''}`;
  } else body = `<div class="nbody">${esc(n.testo || '')}</div>`;

    <div class="nfoot">${pill}<span>${n.esempio ? 'esempio' : n.agg ? fmtShort(n.agg.slice(0, 10)) : ''}</span></div></div>`;
}
function renderNote(){

  return `${sampleNote()}${dispMovedNote()}
  <div class="btnrow"><button class="btn" data-act="newNota" style="flex:1">+ Nota</button><button class="btn ghost" data-act="newLista" style="flex:1">+ Lista</button></div>
  <input class="search" id="nq" type="search" placeholder="Cerca nelle note" value="${esc(V.nq)}" autocomplete="off">
  ${!list.length ? `<div class="empty">${q ? 'Nessuna nota trovata.' : 'Scrivi qui codici cliente, numeri utili, la lista della spesa o le idee per risparmiare.'}</div>` : ''}
  ${pinned.length ? `<section class="block"><div class="block-head"><h3>Fissate</h3></div>${grid(pinned)}</section>` : ''}

  <p style="margin:0;color:var(--muted);font-size:13px">Nelle liste tocca una voce per spuntarla. Con «Ricordamelo il» la nota compare nel calendario e nei promemoria.</p>`;
}
function toggleItem(key){

/* ---------- calendario ---------- */
const ymDiff = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by*12 + bm) - (ay*12 + am); };
function calEvents(y, m){
  const k = monthKey(y, m), dim = new Date(y, m+1, 0).getDate(), t = today(), ev = {};
  const add = (d, e) => (ev[d] ||= []).push(e);
  for (const sc of S.scadenze){
    for (let i = 0; i < 400; i++){
      const d = i ? addMonths(sc.prossima, sc.freq * i) : sc.prossima;
      if (d.slice(0, 7) > k) break;
      if (d.startsWith(k)) add(d, {kind:sc.tipo === 'promemoria' ? 'rem' : 'pay', s:sc, first:i === 0});
      if (!sc.freq) break;
    }
  }
  for (const r of S.ricorrenti){
    if (!r.attivo || (r.ultimo && r.ultimo >= k)) continue;
    const steps = r.ultimo ? ymDiff(r.ultimo, k) : 1;
    if (r.rate && (r.fatte || 0) + steps > r.rate) continue;
    const d = `${k}-${pad(Math.min(r.giorno, dim))}`;
    if (d < t) continue;
    add(d, {kind:r.tipo === 'entrata' ? 'in' : 'ric', r, n:(r.fatte || 0) + steps});
  }
  for (const n of S.appunti) if (n.data && n.data.startsWith(k)) add(n.data, {kind:'nota', n});
  for (const x of S.spese) if (x.garanzia){ const g = garScad(x); if (g.startsWith(k)) add(g, {kind:'gar', x}); }
  return ev;
}
function movItem(s){
  if (s.tipo === 'giro') return `<button class="item" data-spesa="${s.id}"><span class="dot" style="background:var(--muted)"></span>
    <div class="main"><div class="t">${esc(s.descr || 'Giroconto')}</div><div class="s">${esc(contoOf(s.conto).nome)} → ${esc(contoOf(s.contoA).nome)}</div></div>
    <span class="amt num muted">${eur.format(s.importo)}</span></button>`;
  const c = catOf(s.cat), inn = s.tipo === 'entrata';
  const parts = [esc(c.nome), S.conti.length > 1 ? esc(contoOf(s.conto).nome) : '', s.ricId ? 'automatico' : '', s.diviso ? `diviso con ${esc(s.diviso.con)}` : '', s.detraibile ? '730' : '', s.foto ? 'scontrino' : '', ...(s.tags || []).map(t => '#' + esc(t)), s.esempio ? 'esempio' : ''].filter(Boolean);
  return `<button class="item" data-spesa="${s.id}"><span class="dot" style="background:${c.col}"></span>
    <div class="main"><div class="t">${esc(s.descr || c.nome)}</div><div class="s">${parts.join(' · ')}</div></div>
    <span class="amt num ${inn ? 'pos' : ''}">${inn ? '+' : '−'}${eur.format(s.importo)}</span></button>`;
}
function evItem(e){
  if (e.kind === 'nota') return noteItem(e.n, e.n.data <= today());
  if (e.kind === 'gar') return garItem(e.x);
  if (e.kind === 'pay' || e.kind === 'rem'){
    if (e.first) return scadItem(e.s);
    const rem = e.kind === 'rem', c = rem ? {col:'#8A96A3'} : catOf(e.s.cat);
    return `<div class="item" data-scad="${e.s.id}" role="button" tabindex="0"><span class="dot" style="background:${c.col}"></span>
      <div class="main"><div class="t">${esc(e.s.nome)}</div><div class="s">${rem ? 'Promemoria' : 'Pagamento'} previsto · ${FREQN[e.s.freq] || ''}</div></div>
      ${rem ? '' : `<span class="amt num">−${eur.format(e.s.importo)}</span>`}</div>`;

  const r = e.r, c = catOf(r.cat), inn = e.kind === 'in';

    <div class="main"><div class="t">${esc(r.nome)}</div><div class="s">${r.rate ? `Rata ${e.n} di ${r.rate} · ` : ''}verrà registrato in automatico</div></div>
    <span class="amt num ${inn ? 'pos' : ''}">${inn ? '+' : '−'}${eur.format(r.importo)}</span></button>`;
}
function renderCal(){
  const k = monthKey(V.y, V.m), t = today(), dim = new Date(V.y, V.m+1, 0).getDate();
  const offset = (new Date(V.y, V.m, 1).getDay() + 6) % 7;
  if (!V.day || !V.day.startsWith(k)) V.day = t.startsWith(k) ? t : `${k}-01`;
  const byDay = {};
  movMese(V.y, V.m).forEach(x => (byDay[x.data] ||= []).push(x));
  const ev = calEvents(V.y, V.m);
  const outOf = d => sum(usc(byDay[d] || []));
  const maxOut = Math.max(1, ...Object.keys(byDay).map(outOf));
  const allEv = Object.values(ev).flat();
  const planned = allEv.reduce((a, e) => a + (e.kind === 'pay' ? e.s.importo : e.kind === 'ric' ? e.r.importo : 0), 0);
  const expectedIn = allEv.reduce((a, e) => a + (e.kind === 'in' ? e.r.importo : 0), 0);
  let cells = '<span class="cday blank" aria-hidden="true"></span>'.repeat(offset);
  for (let n = 1; n <= dim; n++){
    const d = `${k}-${pad(n)}`, o = outOf(d), inn = sum(ent(byDay[d] || [])), e = ev[d] || [];
    const dots = [];
    if (inn > 0 || e.some(x => x.kind === 'in')) dots.push('in');
    if (e.some(x => x.kind === 'pay')) dots.push(e.some(x => x.kind === 'pay' && d < t) ? 'bad' : 'pay');
    if (e.some(x => x.kind === 'ric')) dots.push('ric');
    if (e.some(x => x.kind === 'rem')) dots.push(d < t ? 'bad' : 'rem');
    if (e.some(x => x.kind === 'nota')) dots.push('nota');
    if (e.some(x => x.kind === 'gar')) dots.push('gar');
    const heat = o ? Math.round(12 + o / maxOut * 48) : 0;
    const lab = [fmtDay(d), o ? `uscite ${eur.format(o)}` : '', inn ? `entrate ${eur.format(inn)}` : '', e.length ? `${e.length} in programma` : ''].filter(Boolean).join(', ');
    cells += `<button class="cday${d === V.day ? ' sel' : ''}${d === t ? ' oggi' : ''}${d > t ? ' fut' : ''}" data-day="${d}" aria-label="${lab}" aria-pressed="${d === V.day}"${heat ? ` style="--h:${heat}%"` : ''}>
      <span class="dn">${n}</span>${o ? `<span class="da num">${o >= 1000 ? (o / 1000).toFixed(1).replace('.', ',') + 'k' : Math.round(o)}</span>` : ''}<span class="dots">${dots.map(x => `<i class="d-${x}"></i>`).join('')}</span></button>`;
  }
  const dm = (byDay[V.day] || []).sort((a,b) => (a.tipo === 'entrata' ? -1 : 1) - (b.tipo === 'entrata' ? -1 : 1)), de = ev[V.day] || [];
  const isCur = t.startsWith(k);
  return `${monthbar()}
  <div class="io">
    <div><span class="label">Uscite del mese</span><b class="num">${eur.format(sum(usc(movMese(V.y, V.m))))}</b></div>
    <div><span class="label">Ancora in programma</span><b class="num">${eur.format(planned)}</b>${expectedIn ? `<small class="num pos">+${eur.format(expectedIn)} in arrivo</small>` : ''}</div>
  </div>
  <div>
    <div class="calhead" aria-hidden="true">${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x => `<span>${x}</span>`).join('')}</div>
    <div class="calgrid" style="margin-top:6px">${cells}</div>
  </div>
  <div class="calleg"><span><i class="heat"></i>più spese</span><span><i class="d-pay"></i>da pagare</span><span><i class="d-bad"></i>scaduto</span><span><i class="d-in"></i>entrata</span><span><i class="d-ric"></i>automatico</span><span><i class="d-rem"></i>promemoria</span><span><i class="d-nota"></i>nota</span><span><i class="d-gar"></i>garanzia</span></div>
  ${isCur ? '' : '<button class="linkbtn" data-act="today" style="align-self:flex-start">Torna a oggi</button>'}
  <section class="block">
    <div class="block-head"><h3 class="dayttl">${fmtDay(V.day)}</h3><button class="linkbtn" data-act="addOnDay">+ Aggiungi</button></div>
    ${de.length ? `<div class="sub">In programma</div><div class="list">${de.map(evItem).join('')}</div>` : ''}
    ${dm.length ? `<div class="sub">Movimenti · <span class="num">${sgn(net(dm))}</span></div><div class="list">${dm.map(movItem).join('')}</div>` : ''}
    ${!de.length && !dm.length ? `<div class="empty">Niente in questo giorno. Tocca «+ Aggiungi» per registrare una spesa con questa data.</div>` : ''}
  </section>`;
}
