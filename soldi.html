  else if (act === 'saveBudget'){ const v = parseAmount($('#budget').value); S.budget = v > 0 ? v : 0; save(); render(); toast(S.budget ? `Budget: ${eur0.format(S.budget)}` : 'Budget rimosso'); }
  else if (act === 'export') exportSheet();
  else if (act === 'import') importSheet();
  else if (act === 'wipe'){
    if (a.dataset.armed){ const snap = snapshot(); S.spese = []; S.scadenze = []; S.ricorrenti = []; S.obiettivi = []; S.appunti = []; S.letture = []; S.contatori = []; S.figliMov = []; S.dispensa = []; setTimeout(() => { if (!S.spese.some(x => x.foto)) fotoClear(); }, 8000); save(); render(); toast('Dati cancellati'); offerUndo(snap); }
    else { a.dataset.armed = '1'; a.textContent = 'Tocca di nuovo per cancellare tutto'; setTimeout(() => { if (a.isConnected){ delete a.dataset.armed; a.textContent = 'Cancella tutti i dati'; } }, 3500); }
  }
});
$('#view').addEventListener('change', e => {
  if (e.target.id === 'opt-prof'){ S.profiliOn = e.target.checked; V.prof = 'tutti'; save(); render(); toast(S.profiliOn ? 'Profili attivi: le voci attuali sono in «' + S.profili[0].nome + '»' : 'Profili disattivati'); }
  else if (e.target.dataset.vis){ S.nascondi[e.target.dataset.vis] = !e.target.checked; save(); }
  else if (e.target.id === 'opt-figli'){ S.figliOn = e.target.checked; save(); render(); toast(S.figliOn ? 'Sezione figli attiva: la trovi nel Riepilogo' : 'Sezione figli disattivata'); }
});
$('#view').addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; if (e.target.matches('[data-scad]')){ e.preventDefault(); formScad(e.target.dataset.scad); } else if (e.target.matches('[data-goal]')){ e.preventDefault(); formGoal(e.target.dataset.goal); } else if (e.target.matches('[data-nota]')){ e.preventDefault(); formNota(e.target.dataset.nota); } else if (e.target.matches('[data-disp]')){ e.preventDefault(); formDisp(e.target.dataset.disp); } });

let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  const added = applyRecurring(), got = readInbox() + moveDispensa();
  if ((added.length || got) && !sheetEl) render();
  if (S.pin && hiddenAt && Date.now() - hiddenAt > 60000) showLock();
  else maybeRemind();
});

/* ---------- installazione ---------- */
const installBtn = $('#installBtn');
let deferredPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true;
const markInstalled = v => { try { v ? localStorage.setItem(KEY_INST, '1') : localStorage.removeItem(KEY_INST); } catch(_){} };
const wasInstalled = () => { try { return localStorage.getItem(KEY_INST) === '1'; } catch(_){ return false; } };
function updateInstallBtn(){ installBtn.hidden = isStandalone() || wasInstalled(); }

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  markInstalled(false); updateInstallBtn();
  const n = document.getElementById('in-now'); if (n) n.hidden = false;
});
window.addEventListener('appinstalled', () => { deferredPrompt = null; markInstalled(true); updateInstallBtn(); toast('App installata'); });
window.matchMedia('(display-mode: standalone)').addEventListener?.('change', updateInstallBtn);

async function doInstall(){
  const ev = deferredPrompt; if (!ev) return false;
  deferredPrompt = null;
  try { ev.prompt(); const r = await ev.userChoice; if (r.outcome === 'accepted'){ markInstalled(true); updateInstallBtn(); closeSheet(); } } catch(_){}
  return true;
}
async function installChecks(){
  const ua = navigator.userAgent, out = [];
  const add = (ok, t, help) => out.push({ok, t, help});
  add(location.protocol === 'https:', 'Indirizzo sicuro (https)', 'Apri l\'app dall\'indirizzo https://gelu92.github.io/…');
  const inApp = /; wv\)|FBAN|FBAV|Instagram|GitHub|WhatsApp/i.test(ua), chrome = /Chrome\//.test(ua) && !/EdgA|OPR|SamsungBrowser|Firefox/i.test(ua);
  add(chrome && !inApp, 'Aperta in Chrome', inApp ? 'Sei nel browser interno di un\'altra app: menu ⋮ → «Apri in Chrome».' : 'Apri l\'indirizzo con Google Chrome.');
  let man = null;
  try { const r = await fetch(document.querySelector('link[rel=manifest]').href, {cache:'no-store'}); if (r.ok) man = await r.json(); } catch(_){}
  add(!!(man && man.id), 'Manifest trovato' + (man && man.id ? ` (${man.id})` : ''), 'Il file manifest.json non è nella stessa cartella di index.html.');
  let icons = false;
  try { const r = await fetch('icon-512.png', {cache:'no-store'}); icons = r.ok; } catch(_){}
  add(icons, 'Icone trovate', 'I file icon-192.png e icon-512.png non sono nella stessa cartella di index.html.');
  let sw = false;
  try { const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration(); sw = !!(reg && (reg.active || reg.waiting || reg.installing)); } catch(_){}
  add(sw, 'Funzionamento offline attivo', 'Il file sw.js non è nella stessa cartella oppure la pagina va ricaricata.');
  add(!!deferredPrompt, 'Chrome pronto a installare', 'Tocca qualche schermata e lascia l\'app aperta circa 30 secondi: si attiva da solo. Se avevi già rifiutato l\'installazione, Chrome per un po\' non la ripropone: usa il menu ⋮.');
  return out;
}
function installSheet(){
  const CK = '<span class="pill ok">OK</span>', NO = '<span class="pill warn">Da sistemare</span>', WAIT = '<span class="pill warn">In attesa</span>';
  openSheet(`<h2>Installa Soldi</h2>
    <button class="btn wide" id="in-now" hidden>Installa ora</button>
    <div id="in-ck" class="list"><div class="item"><div class="main"><div class="t">Controllo in corso…</div></div></div></div>
    <div class="sub">Oppure dal menu di Chrome</div>
    <ol class="steps"><li>Tocca il menu <b>⋮</b> in alto a destra.</li><li>Scegli <b>Installa app</b> (o <b>Aggiungi a schermata Home</b>, poi <b>Installa</b>).</li><li>Conferma.</li></ol>
    <button class="btn ghost wide" data-close>Chiudi</button>`, root => {
    const now = root.querySelector('#in-now');
    now.addEventListener('click', doInstall);
    let timer = null;
    const tick = async () => {
      if (!root.isConnected){ clearInterval(timer); return; }
      now.hidden = !deferredPrompt;
      const l = await installChecks();
      if (!root.isConnected) return;
      root.querySelector('#in-ck').innerHTML = l.map((c, i) => `<div class="item"><div class="main"><div class="t">${c.t}</div>${c.ok ? '' : `<div class="s" style="white-space:normal">${c.help}</div>`}</div>${c.ok ? CK : i === l.length - 1 ? WAIT : NO}</div>`).join('');
    };
    tick(); timer = setInterval(tick, 2000);
  });
}
installBtn.addEventListener('click', async () => { if (!(await doInstall())) installSheet(); });
if (isStandalone()) markInstalled(true);
updateInstallBtn();

if (!IN_HOME && 'serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- avvio ---------- */
load();
applyTheme();
readInbox();
moveDispensa();
const autoAdded = applyRecurring();
render();
if (S.pin) showLock(); else if (!handleAzione()){ if (S.onboard === 'pending') wizard(); else maybeRemind(); }
if (autoAdded.length) toast(`Registrati in automatico: ${[...new Set(autoAdded)].join(', ')}`);
/* ---------- aggancio per Home ---------- */
window.__home = {
  ready:true,
  pay(id){ pay(id); },
  fatto(id){ markDone(id); },
  open(k, id){ if (k === 'mov') formMov(id); else if (k === 'scad') formScad(id); },
  events(from, to){
    if (locked) return [];
    const out = [];
    S.scadenze.forEach(x => {
      let d = x.prossima, g = 0;
      while (d && d <= to && g++ < 60){ if (d >= from) out.push({d, t:x.nome, s:x.tipo === 'promemoria' ? 'Promemoria' : eur.format(x.importo || 0), go:{tab:'scad'}}); if (!(x.freq > 0)) break; d = addMonths(d, x.freq); }
    });
    return out;
  },
  search(q){
    if (locked) return [{t:'Soldi è protetto dal PIN', s:'Sbloccalo per cercare anche lì', go:{}}];
    const h = (...a) => a.some(v => String(v || '').toLowerCase().includes(q));
    const out = [];
    S.spese.filter(x => h(x.descr, x.note, (x.tag || []).join(' '))).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 12).forEach(x => out.push({t:x.descr || catOf(x.cat).nome, s:`${x.tipo === 'entrata' ? 'Entrata' : 'Uscita'} · ${eur.format(x.importo)} · ${x.data.split('-').reverse().join('/')}`, open:['mov', x.id]}));
    S.scadenze.filter(x => h(x.nome)).forEach(x => out.push({t:x.nome, s:x.tipo === 'promemoria' ? 'Promemoria' : 'Scadenza · ' + eur.format(x.importo || 0), open:['scad', x.id]}));
    return out;
  },
  report(y, m){
    if (locked) return {locked:true};
    const cur = movMese(y, m), out = sum(usc(cur)), inn = sum(ent(cur));
    const cats = Object.entries(usc(cur).reduce((o, x) => (o[x.cat] = (o[x.cat] || 0) + x.importo, o), {})).sort((a, b) => b[1] - a[1]).slice(0, 3);
    return {rows:[['Uscite', eur.format(out)], ['Entrate', eur.format(inn)], ['Saldo', (inn - out >= 0 ? '+' : '−') + eur.format(Math.abs(inn - out))]], note:cats.length ? 'Le spese più grosse: ' + cats.map(([c, v]) => `${catOf(c).nome} ${eur.format(v)}`).join(', ') + '.' : ''};
  },
  show(){ try { const added = applyRecurring(), got = readInbox() + moveDispensa(); if (!sheetEl && !locked) render(); } catch(_){} },
  summary(){
    if (locked) return {locked:true};
    const d = new Date(), cur = movMese(d.getFullYear(), d.getMonth()), out = sum(usc(cur)), inn = sum(ent(cur)), b = S.budget || 0;
    const items = [];
    S.scadenze.filter(x => x.tipo !== 'promemoria' && daysUntil(x.prossima) <= 7).sort((a, c) => a.prossima.localeCompare(c.prossima)).forEach(x => {
      const n = daysUntil(x.prossima);
      items.push({t:x.nome, s:`${eur.format(x.importo || 0)} · ${n < 0 ? `scaduta da ${-n} gg` : n === 0 ? 'oggi' : n === 1 ? 'domani' : `tra ${n} giorni`}`, cls:n < 0 ? 'bad' : n <= 2 ? 'warn' : '', go:{tab:'scad'}, pay:x.id});
    });
    S.scadenze.filter(x => x.tipo === 'promemoria' && isDue(x)).forEach(x => items.push({t:x.nome, s:'Promemoria', cls:'warn', go:{tab:'scad'}, fatto:x.id}));
    notesDue(3).forEach(n => items.push({t:n.titolo || 'Nota', s:'Nota da ricordare', go:{tab:'note'}}));
    garanzieIn(30).forEach(g => items.push({t:g.descr || g.nome || 'Garanzia', s:'Garanzia in scadenza', cls:'warn', go:{tab:'scad'}}));
    return {
      head:d.toLocaleDateString('it-IT', {month:'long'}).replace(/^./, c => c.toUpperCase()),
      kpi:[{l:'Uscite del mese', v:eur.format(out)}, {l:'Entrate', v:eur.format(inn)}, b ? {l:out > b ? 'Budget superato di' : 'Restano del budget', v:eur.format(Math.abs(b - out)), cls:out > b ? 'bad' : ''} : {l:'Saldo', v:eur.format(inn - out), cls:inn - out < 0 ? 'bad' : ''}],
      meter:b ? Math.min(100, Math.round(out / b * 100)) : null,
      items, empty:'Nessun pagamento nei prossimi 7 giorni.'
    };
  },
  go(g){
    g = g || {};
    if (g.tab) goTab(g.tab);
    if (g.act){ const b = document.createElement('button'); b.type = 'button'; b.dataset.act = g.act; b.hidden = true; $('#view').appendChild(b); b.click(); b.remove(); }
  },
  azione(a){ try { history.replaceState(null, '', '?azione=' + a); } catch(_){} handleAzione(); },
  setTheme(t){ S.tema = t; save(); applyTheme(); },
  setDesk(on){ document.documentElement.classList.toggle('desk', !!on); }
};
})();
</script>
</body>
</html>
